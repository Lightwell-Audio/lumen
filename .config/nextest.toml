[profile.ci]
retries = 2
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"
final-status-level = "flaky"
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.timing]
retries = 2
fail-fast = false
test-threads = 1
failure-output = "immediate-final"
status-level = "retry"
final-status-level = "flaky"
slow-timeout = { period = "60s", terminate-after = 8 }
