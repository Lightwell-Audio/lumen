# cargo-nextest settings (CI and, optionally, local runs). `cargo test` keeps
# working: nothing here is required to build or test Lumen.
#
# Why nextest: `cargo test` runs the test binaries one after another, and a
# binary with a few slow tests leaves cores idle. nextest runs every test from
# every binary in one pool, one test per core by default. See
# docs/DEVELOPMENT.md ("Running the tests").
#
# The thread count stays at the default on purpose. The e2e suite looks
# wait-bound on a developer machine (the paced test device plays a block per
# poll, ADR-0063), so 12 tests at once ran it in 93 s instead of 157 s on 4
# cores. On the CI runners it is CPU-bound: 12 at once took the same 205 s as
# before and failed timing-sensitive tests (run 38847282597). Do not raise it
# without a CI run that shows a gain and no failures.

[profile.default]
# One run shows every failure, as `cargo test --no-fail-fast` does in CI.
fail-fast = false
# A test that has not finished after this long is reported as slow; it is
# killed after the terminate-after count of periods. The e2e tests wait up to
# 30 s for background work (PATIENCE), so nothing legitimate comes near 3 min.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
inherits = "default"
failure-output = "immediate-final"
