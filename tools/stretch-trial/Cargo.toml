# The M9.5 S0 time-stretch trial (docs/milestones/M9.5.md, TS1). A bench
# program that is never shipped: it is its own workspace, so its candidate
# libraries (some GPL or MPL) never enter Lumen's Cargo.lock or cargo-deny.
[package]
name = "stretch-trial"
version = "0.0.1"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
signalsmith-stretch = "0.1.3"
rubberband = "0.1.5"
bungee-rs = "0.1.1"
timestretch = "0.16.0"
hound = "3"

[profile.release]
debug = 1
