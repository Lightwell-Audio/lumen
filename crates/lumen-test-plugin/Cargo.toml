[package]
name = "lumen-test-plugin"
description = "Deterministic VST3 test plugins (an instrument and an effect) with injectable faults"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vst3.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSEvent",
    "NSGraphics", "NSScreen", "NSRunningApplication", "objc2-core-foundation",
    "NSTextField", "NSControl", "NSCell", "NSText",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSObject",
] }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
