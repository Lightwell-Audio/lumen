[package]
name = "lumen-app"
description = "The Lumen desktop application"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
lumen-audio.workspace = true
lumen-brand.workspace = true
lumen-core.workspace = true
lumen-devices.workspace = true
lumen-hosting = { path = "../lumen-hosting" }
lumen-engine.workspace = true
lumen-media.workspace = true
lumen-midi.workspace = true
lumen-plugin-catalog = { path = "../lumen-plugin-catalog" }
lumen-project.workspace = true
lumen-render.workspace = true
lumen-rt.workspace = true
png.workspace = true
rtrb.workspace = true
rfd.workspace = true
trash.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
lumen-brand.workspace = true
embed-resource.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image.workspace = true
toml.workspace = true
lumen-test-plugin = { path = "../lumen-test-plugin" }
lumen-testkit.workspace = true

[lints]
workspace = true
