[package]
name = "lumen-app"
description = "The Lumen desktop application"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
lumen-audio.workspace = true
lumen-core.workspace = true
lumen-devices.workspace = true
lumen-hosting = { path = "../lumen-hosting" }
lumen-engine.workspace = true
lumen-media.workspace = true
lumen-midi.workspace = true
lumen-plugin-catalog = { path = "../lumen-plugin-catalog" }
lumen-project.workspace = true
lumen-render.workspace = true
lumen-rt.workspace = true
png.workspace = true
rtrb.workspace = true
rfd.workspace = true
trash.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"]

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
lumen-test-plugin = { path = "../lumen-test-plugin" }

[lints]
workspace = true
