[package]
name = "lumen-hosting"
description = "Lumen's side of plugin hosting: a process per plugin device, loaded in the background, and the link the engine plays it through"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lumen-core.workspace = true
lumen-devices.workspace = true
lumen-plugin-host = { path = "../lumen-plugin-host" }

[dev-dependencies]
lumen-engine.workspace = true
lumen-rt.workspace = true
lumen-test-plugin = { path = "../lumen-test-plugin" }

# The soak reads the test process's memory and handle counts.
[target.'cfg(windows)'.dev-dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"]

[lints]
workspace = true
