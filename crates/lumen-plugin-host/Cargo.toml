[package]
name = "lumen-plugin-host"
description = "The plugin host: loads a VST3 module in its own process and serves it over a versioned protocol"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vst3.workspace = true
libloading.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
]

[dev-dependencies]
lumen-test-plugin = { path = "../lumen-test-plugin" }

[lints]
workspace = true
