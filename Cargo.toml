[workspace]
resolver = "3"
members = ["crates/*", "prototypes/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
# Lumen is free software under GPL-3.0-or-later (ADR-0039; text in LICENSE).
# Crates stay unpublished.
license = "GPL-3.0-or-later"

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-rt = { path = "crates/lumen-rt" }

divan = "0.1"
rtrb = "0.4"
engine-core = { path = "prototypes/engine-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
windows-sys = "0.61"
vst3 = "0.3"
# Loads plugin modules (ISC). Already in the tree through cpal and wgpu.
libloading = "0.8"
libc = "0.2"
base64 = "0.22"
# Standard MIDI Files (M5 slice 7): Unlicense, a public-domain dedication.
midly = { version = "0.5", default-features = false, features = ["std"] }
wasapi = "0.25"
cpal = "0.18"
rtsan-standalone = "0.3"
png = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "ogg", "vorbis"] }
flacenc = { version = "0.5.1", default-features = false }
rubato = "5"
eframe = "0.36"
# egui's test harness, for the end-to-end suite (ADR-0029). Keep it at
# eframe's version.
egui_kittest = "0.36"
vello = "0.11"
wgpu = "30"
# The shader compiler, for build-time checks (lumen-shader-check). Keep it
# at the version wgpu uses: upgrade the two together.
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"
pollster = "0.4"
rfd = "0.17"
raw-window-handle = "0.6"
parley = "0.11"
accesskit = "0.24"
accesskit_winit = "0.32"
lumen-render = { path = "crates/lumen-render" }
lumen-audio = { path = "crates/lumen-audio" }
lumen-midi = { path = "crates/lumen-midi" }
lumen-devices = { path = "crates/lumen-devices" }
lumen-project = { path = "crates/lumen-project" }
lumen-engine = { path = "crates/lumen-engine" }
lumen-media = { path = "crates/lumen-media" }
lumen-perf = { path = "crates/lumen-perf" }
lumen-shader-check = { path = "crates/lumen-shader-check" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
