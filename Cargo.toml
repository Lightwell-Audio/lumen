[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
# Lumen's own license is not decided yet (see ADR-0012); no `license` field
# until a human decides.

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-rt = { path = "crates/lumen-rt" }

divan = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
