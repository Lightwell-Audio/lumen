[workspace]
resolver = "3"
members = ["crates/*", "prototypes/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
# Lumen is closed source (ADR-0012, decided 2026-10-05). Crates are
# unpublished, so no `license` field is needed.

[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-rt = { path = "crates/lumen-rt" }

divan = "0.1"
rtrb = "0.4"
engine-core = { path = "prototypes/engine-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
windows-sys = "0.61"
vst3 = "0.3"
base64 = "0.22"
wasapi = "0.25"
cpal = "0.18"
rtsan-standalone = "0.3"
png = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "ogg", "vorbis"] }
rubato = "5"
eframe = "0.36"
vello = "0.11"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
parley = "0.11"
accesskit = "0.24"
accesskit_winit = "0.32"
lumen-render = { path = "crates/lumen-render" }
lumen-audio = { path = "crates/lumen-audio" }
lumen-project = { path = "crates/lumen-project" }
lumen-engine = { path = "crates/lumen-engine" }
lumen-media = { path = "crates/lumen-media" }
lumen-perf = { path = "crates/lumen-perf" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[profile.release]
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"
