name: Docs

# The user documentation's checks (docs/USER_DOCS.md §8.3). CI skips changes
# to Markdown alone, and the docs' pages are Markdown, so they are checked
# here: on every pull request that touches the site or the app, whose
# commands, settings and scenes the pages are made from.
#
# Two paths run side by side: the checks, and the media (the reusable
# docs-render.yml, shared with the deploy: its scenes are rendered in
# parallel jobs and kept by fingerprint, so a second push to the branch
# renders only what it changed). The last job (`docs`) waits for both, then
# builds the pages with that media. It builds no Rust: the render jobs leave
# it the plan and the data the pages are made from.
on:
  pull_request:
    paths:
      - "site/**"
      - "crates/**"
      - "docs/design-system/**"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-render.yml"
      - ".github/scripts/docs-media.sh"
      - ".github/scripts/undocumented-check.sh"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The backlog in undocumented.txt only shrinks (§5.3). A slice may add
      # an action only with its milestone's tag (`id @m9.5`, §10.1, ADR-0133),
      # to be written at that milestone's docs pass. Skipped while the base
      # branch has no such file.
      - name: The undocumented list only shrinks, or defers with a tag
        run: |
          list=site/docs/data/undocumented.txt
          base="origin/${{ github.base_ref }}"
          if git show "$base:$list" > "$RUNNER_TEMP/undocumented.base" 2>/dev/null; then
            bash .github/scripts/undocumented-check.sh "$RUNNER_TEMP/undocumented.base" "$list"
          fi
      # mesa-vulkan-drivers is lavapipe: the scenes run the app on a
      # software Vulkan device, as the E2E suite does.
      - name: Install Linux system libraries
        run: |
          bash .github/scripts/retry.sh sudo apt-get update
          bash .github/scripts/retry.sh sudo apt-get install -y libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libfontconfig1-dev mesa-vulkan-drivers ffmpeg
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: bash .github/scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # Every action has a page, every page names real actions and shots,
      # and no page names another product.
      - name: Coverage and names
        run: cargo test --locked -p lumen-app --test docs_coverage --test third_party_names --test product_name
      # Each scene drives the app as its page tells the reader to, once and
      # in one theme, writing nothing: a page whose steps stopped working
      # fails here.
      - name: Scenes
        run: cargo test --locked -p lumen-app --test docs_media -- --ignored --test-threads=1

  # The scenes this branch changed are rendered (USER_DOCS.md §13, A) and
  # the others are fetched from the published site. Before the first deploy
  # every scene renders.
  media:
    name: docs media
    uses: ./.github/workflows/docs-render.yml
    with:
      full: false
      jobs: 6

  docs:
    name: docs
    needs: [checks, media]
    # Runs even when a job it waits for failed, to fail itself: a job
    # skipped for a failed dependency would count as passed for a branch
    # that requires the `docs` check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: The checks and the media passed
        env:
          CHECKS: ${{ needs.checks.result }}
          MEDIA: ${{ needs.media.result }}
        run: |
          if [ "$CHECKS" != success ] || [ "$MEDIA" != success ]; then
            echo "::error::docs checks: $CHECKS, docs media: $MEDIA"
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: ${{ runner.temp }}/plans
      # The jobs made the plan alone; it must be the same one.
      - id: plan
        name: The plan
        run: |
          plan="$RUNNER_TEMP/plan/plan.json"
          bash .github/scripts/docs-media.sh plans "$RUNNER_TEMP/plans" "$plan"
          echo "count=$(jq '.render | length' "$plan")" >> "$GITHUB_OUTPUT"
          echo "generation=$(jq -r '.generation[0:12]' "$plan")" >> "$GITHUB_OUTPUT"
      # What the pages are made from, exported by the job that had the app
      # built.
      - uses: actions/download-artifact@v4
        with:
          name: docs-data
          path: site/docs/data
      - if: steps.plan.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: scenes-*
          merge-multiple: true
          path: ${{ runner.temp }}/scenes
      # Saved before the build, so a page that fails to build does not cost
      # the next push its scenes.
      - name: Collect the rendered scenes
        if: steps.plan.outputs.count != '0'
        run: |
          bash .github/scripts/docs-media.sh keep "$RUNNER_TEMP/docs-scene-cache"             "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes"
      - name: Keep the rendered scenes
        if: steps.plan.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/docs-scene-cache
          key: docs-scenes-${{ steps.plan.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Gather the media
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          published="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/docs/media"
          bash .github/scripts/docs-media.sh gather "$published" \
            "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes" site/docs/static/media
      # A wrong shortcode, a shot without alt text, an unknown key or a
      # broken internal link stops the build. The pages are built for
      # localhost:8123, beside the landing page whose stylesheet, fonts and
      # pictures they use, so the artifact can be looked at as it is:
      # unzip it and serve the folder (site/docs/README.md).
      - name: Build
        env:
          DOCS_DATA_READY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude /docs/ site/ "$RUNNER_TEMP/site/"
          site/docs/build.sh "$RUNNER_TEMP/site" http://localhost:8123/docs
      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
          retention-days: 7
