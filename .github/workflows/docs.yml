name: Docs

# The user documentation's checks (docs/USER_DOCS.md §8.3). CI skips changes
# to Markdown alone, and the docs' pages are Markdown, so they are checked
# here: on every pull request that touches the site or the app, whose
# commands, settings and scenes the pages are made from.
#
# Three jobs. `checks` runs the fast checks and plans the media render;
# `media` renders the changed scenes, one shard of them per job, as the
# Site workflow does (pages.yml, USER_DOCS.md §13); `check` (the check named
# "docs") gathers the media and builds the pages. Rendered in one serial
# step, the changed scenes of PR #98 took 32 minutes, and the job's limit is
# 75, so each scene a branch changes adds to the wait.
on:
  pull_request:
    paths:
      - "site/**"
      - "crates/**"
      - "docs/design-system/**"
      - "Cargo.lock"
      - ".github/workflows/docs.yml"
      - ".github/scripts/docs-media.sh"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # undocumented.txt only shrinks (§5.3): a new action gets a page, not
      # a line here. Skipped while the base branch has no such file.
      - name: The undocumented list only shrinks
        run: |
          list=site/docs/data/undocumented.txt
          base="origin/${{ github.base_ref }}"
          if before=$(git show "$base:$list" 2>/dev/null); then
            added=$(comm -13 <(printf '%s\n' "$before" | sort -u) <(sort -u "$list") \
              | grep -v -e '^#' -e '^[[:space:]]*$' || true)
            if [ -n "$added" ]; then
              echo "::error file=$list::undocumented.txt only shrinks; give these a page instead:"
              echo "$added"
              exit 1
            fi
          fi
      # mesa-vulkan-drivers is lavapipe: the scenes run the app on a
      # software Vulkan device, as the E2E suite does.
      - name: Install Linux system libraries
        run: |
          bash .github/scripts/retry.sh sudo apt-get update
          bash .github/scripts/retry.sh sudo apt-get install -y libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libfontconfig1-dev mesa-vulkan-drivers ffmpeg
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: bash .github/scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      # Every action has a page, every page names real actions and shots,
      # and no page names another product.
      - name: Coverage and names
        run: cargo test --locked -p lumen-app --test docs_coverage --test third_party_names --test product_name
      # Each scene drives the app as its page tells the reader to, once and
      # in one theme, writing nothing: a page whose steps stopped working
      # fails here.
      - name: Scenes
        run: cargo test --locked -p lumen-app --test docs_media -- --ignored --test-threads=1
      # The scenes this branch changed are rendered (USER_DOCS.md §13, A) by
      # the `media` jobs, one shard each; the others are fetched from the
      # published site. Before the first deploy every scene renders.
      - id: plan
        name: Plan the media render
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          published="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/docs/media"
          plan="$RUNNER_TEMP/plan/plan.json"
          bash .github/scripts/docs-media.sh plan "$published" "$plan" false 4
          echo "shards=$(jq -c .shards "$plan")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.shards | length' "$plan")" >> "$GITHUB_OUTPUT"
      - name: Keep the media plan
        uses: actions/upload-artifact@v4
        with:
          name: docs-plan
          path: ${{ runner.temp }}/plan
          retention-days: 1

  media:
    name: media ${{ matrix.shard.index }}
    needs: checks
    if: needs.checks.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.checks.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      # lavapipe (mesa-vulkan-drivers) renders the app; ffmpeg encodes its
      # clips. Neither ships with Lumen.
      - name: Install Linux system libraries and ffmpeg
        run: |
          bash .github/scripts/retry.sh sudo apt-get update
          bash .github/scripts/retry.sh sudo apt-get install -y libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libfontconfig1-dev mesa-vulkan-drivers ffmpeg
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: bash .github/scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # Each scene into its own folder, so the check knows which files are
      # whose.
      - name: Render this job's scenes
        env:
          TESTS: ${{ matrix.shard.tests }}
        run: |
          # shellcheck disable=SC2086 # the tests are words
          bash .github/scripts/docs-media.sh render "$RUNNER_TEMP/scenes" $TESTS
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/scenes
          if-no-files-found: error
          retention-days: 1

  check:
    name: docs
    needs: [checks, media]
    # The media jobs are skipped when no scene changed; they must not have
    # failed.
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success'
          && (needs.media.result == 'success' || needs.media.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        run: |
          bash .github/scripts/retry.sh sudo apt-get update
          bash .github/scripts/retry.sh sudo apt-get install -y libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libfontconfig1-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: bash .github/scripts/retry.sh rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - uses: actions/download-artifact@v4
        with:
          name: docs-plan
          path: ${{ runner.temp }}/plan
      - if: needs.media.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: scenes-*
          merge-multiple: true
          path: ${{ runner.temp }}/scenes
      # The rendered scenes, the others fetched from the published site as
      # they are, and the manifest the next deploy plans against.
      - name: Gather the media
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          published="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/docs/media"
          bash .github/scripts/docs-media.sh gather "$published" \
            "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes" site/docs/static/media
      # A wrong shortcode, a shot without alt text, an unknown key or a
      # broken internal link stops the build. The pages are built for
      # localhost:8123, beside the landing page whose stylesheet, fonts and
      # pictures they use, so the artifact can be looked at as it is:
      # unzip it and serve the folder (site/docs/README.md).
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude /docs/ site/ "$RUNNER_TEMP/site/"
          site/docs/build.sh "$RUNNER_TEMP/site" http://localhost:8123/docs
      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/site
          retention-days: 7
