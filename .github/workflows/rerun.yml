name: Rerun

on:
  workflow_run:
    workflows: [CI, Docs]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: rerun a failure of the infrastructure
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Rerun the failed jobs if only the infrastructure failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/scripts/rerun-infra.sh
