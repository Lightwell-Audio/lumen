name: Site

# Publishes the landing page and the user documentation (docs/USER_DOCS.md
# §8.2) to GitHub Pages when either changes on main, or the app the docs
# are made from. The repository's Pages source must be set to "GitHub
# Actions" (Settings > Pages) once.
#
# The docs' media is rendered from the real app, at about 0.3 s a frame on
# the software renderer. The owner chose (USER_DOCS.md §13, A): a push
# renders only the scenes whose own source, pages or gestures changed since
# the published site, and takes the rest from the published site as it is;
# a full render runs by hand ("Run workflow", full) at each milestone's
# docs pass, shared among parallel jobs. The plan is
# `plan_the_render` in crates/lumen-app/tests/docs_coverage.rs.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "docs/design-system/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
      - ".github/scripts/docs-media.sh"
  workflow_dispatch:
    inputs:
      full:
        description: "Render every scene again (each milestone's docs pass)"
        type: boolean
        default: true
      jobs:
        description: "How many jobs share the render"
        type: number
        default: 8

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libfontconfig1-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - id: pages
        uses: actions/configure-pages@v5
      # Against what the published site was made from; with none yet (the
      # first deploy, or Pages was reset), every scene renders.
      - id: plan
        name: Plan the render
        env:
          PUBLISHED: ${{ steps.pages.outputs.base_url }}/docs/media
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          JOBS: ${{ inputs.jobs || 4 }}
        run: |
          plan="$RUNNER_TEMP/plan/plan.json"
          bash .github/scripts/docs-media.sh plan "$PUBLISHED" "$plan" "$FULL" "$JOBS"
          echo "shards=$(jq -c .shards "$plan")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.shards | length' "$plan")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-plan
          path: ${{ runner.temp }}/plan
          retention-days: 1

  render:
    name: render ${{ matrix.shard.index }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      # The encoded clips live outside target/, which the Rust cache cleans.
      # (The runner context is not available in a workflow's env.)
      - name: Where the encoded clips are kept
        run: echo "DOCS_MEDIA_CACHE=$RUNNER_TEMP/docs-media-cache" >> "$GITHUB_ENV"
      # lavapipe (mesa-vulkan-drivers) renders the app; ffmpeg encodes its
      # clips. Neither ships with Lumen.
      - name: Install Linux system libraries and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libfontconfig1-dev mesa-vulkan-drivers ffmpeg
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      # Encoded clips by the hash of what went into them: a scene rendered
      # again for a page edit draws the same frames and encodes nothing.
      # Each job saves its own entry and starts from its latest one.
      - name: Restore the encoded clips
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docs-media-cache
          key: docs-media-${{ matrix.shard.index }}-${{ github.run_id }}
          restore-keys: |
            docs-media-${{ matrix.shard.index }}-
            docs-media-
      # Each scene into its own folder, so the deploy knows which files are
      # whose, with how long it took (the next full render shares the work
      # out by it).
      - name: Render this job's scenes
        env:
          TESTS: ${{ matrix.shard.tests }}
        run: |
          touch "$RUNNER_TEMP/render-started"
          # shellcheck disable=SC2086 # the tests are words
          bash .github/scripts/docs-media.sh render "$RUNNER_TEMP/scenes" $TESTS
      # Entries no scene used this run belong to clips that changed or are
      # gone; dropping them keeps the cache to one set of clips.
      - name: Drop unused encoded clips
        run: |
          for entry in "$DOCS_MEDIA_CACHE"/*/; do
            [ -e "$entry" ] || continue
            if [ ! "${entry}used" -nt "$RUNNER_TEMP/render-started" ]; then
              rm -rf "$entry"
            fi
          done
          du -sh "$DOCS_MEDIA_CACHE" "$RUNNER_TEMP/scenes"
      - uses: actions/upload-artifact@v4
        with:
          name: scenes-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/scenes
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: [plan, render]
    # The render is skipped when no scene changed; it must not have failed.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
          && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libfontconfig1-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: docs-plan
          path: ${{ runner.temp }}/plan
      - if: needs.render.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: scenes-*
          merge-multiple: true
          path: ${{ runner.temp }}/scenes
      # The rendered scenes, the others fetched from the published site as
      # they are, and the manifest the next deploy plans against.
      - name: Gather the media
        env:
          PUBLISHED: ${{ steps.pages.outputs.base_url }}/docs/media
        run: |
          bash .github/scripts/docs-media.sh gather "$PUBLISHED" \
            "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes" site/docs/static/media
      # The landing page as it is, and the docs built into docs/ beside it.
      - name: Build the site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude /docs/ site/ "$RUNNER_TEMP/site/"
          site/docs/build.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
