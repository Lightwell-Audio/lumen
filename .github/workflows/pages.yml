name: Site

# Publishes the landing page and the user documentation (docs/USER_DOCS.md
# §8.2) to GitHub Pages when either changes on main, or the app the docs
# are made from. The repository's Pages source must be set to "GitHub
# Actions" (Settings > Pages) once.
#
# The docs' media is rendered from the real app, at about 0.3 s a frame on
# the software renderer. The owner chose (USER_DOCS.md §13, A): a push
# renders only the scenes whose own source, pages or gestures changed since
# the published site, and takes the rest from the published site as it is;
# a full render runs by hand ("Run workflow", full) at each milestone's
# docs pass, shared among parallel jobs. The plan and the render are the
# reusable workflow docs-render.yml, which the pull-request check (docs.yml)
# runs as well; the plan is `plan_the_render` in
# crates/lumen-app/tests/docs_coverage.rs.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "docs/design-system/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
      - ".github/workflows/docs-render.yml"
      - ".github/scripts/docs-media.sh"
  workflow_dispatch:
    inputs:
      full:
        description: "Render every scene again (each milestone's docs pass)"
        type: boolean
        default: true
      jobs:
        description: "How many jobs share the render"
        type: number
        default: 8

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: media
    uses: ./.github/workflows/docs-render.yml
    with:
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
      jobs: ${{ github.event_name == 'workflow_dispatch' && inputs.jobs || 6 }}

  deploy:
    name: deploy
    needs: render
    # Every render job makes the plan, and renders only its share of it
    # (none, when no scene changed).
    if: ${{ !cancelled() && needs.render.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-*
          path: ${{ runner.temp }}/plans
      # The jobs made the plan alone; it must be the same one.
      - id: plan
        name: The plan
        run: |
          plan="$RUNNER_TEMP/plan/plan.json"
          bash .github/scripts/docs-media.sh plans "$RUNNER_TEMP/plans" "$plan"
          echo "count=$(jq '.render | length' "$plan")" >> "$GITHUB_OUTPUT"
          echo "generation=$(jq -r '.generation[0:12]' "$plan")" >> "$GITHUB_OUTPUT"
      # What the pages are made from, exported by the job that had the app
      # built (this one has no Rust).
      - uses: actions/download-artifact@v4
        with:
          name: docs-data
          path: site/docs/data
      - if: steps.plan.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: scenes-*
          merge-multiple: true
          path: ${{ runner.temp }}/scenes
      # The rendered scenes, the others fetched from the published site as
      # they are, and the manifest the next deploy plans against.
      # Saved before the build, so a page that fails to build does not cost
      # the next run its scenes. On main, so every pull request can read it.
      - name: Collect the rendered scenes
        if: steps.plan.outputs.count != '0'
        run: |
          bash .github/scripts/docs-media.sh keep "$RUNNER_TEMP/docs-scene-cache" \
            "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes"
      - name: Keep the rendered scenes
        if: steps.plan.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/docs-scene-cache
          key: docs-scenes-${{ steps.plan.outputs.generation }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Gather the media
        env:
          PUBLISHED: ${{ steps.pages.outputs.base_url }}/docs/media
        run: |
          bash .github/scripts/docs-media.sh gather "$PUBLISHED" \
            "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/scenes" site/docs/static/media
      # The landing page as it is, and the docs built into docs/ beside it.
      - name: Build the site
        env:
          DOCS_DATA_READY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude /docs/ site/ "$RUNNER_TEMP/site/"
          site/docs/build.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
