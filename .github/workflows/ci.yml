name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest builds the production target, x86_64-pc-windows-msvc.
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev \
            libfontconfig1-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --all-targets also runs every divan benchmark once as a smoke test.
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      # Scanner isolation: crashing, hanging and broken VST3 modules must be
      # contained and classified (P-VST3). Windows-only until the macOS and
      # Linux port (ROADMAP.md, Stretch goals).
      - name: VST3 scanner isolation self-test
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p vst3-scan -p vst3-test-module
          target/release/vst3-scan selftest
        shell: bash

  # RealtimeSanitizer (ADR-0010): real-time sections must not lock, block or
  # allocate. The crate downloads a prebuilt runtime when RTSAN_ENABLE is set.
  rtsan:
    name: realtime sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RTSAN_ENABLE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: rtsan
      - name: Real-time tests under RTSan
        run: cargo test --locked -p lumen-engine -p engine-core --test realtime
      # Each canary opens a file, waits on a held lock or allocates inside a
      # real-time section. Each must abort with an RTSan report on its own, or
      # the sanitizer is not actually running. (Canaries chosen by probing the
      # runtime: it misses std::thread::sleep and uncontended locks.)
      - name: Canaries (each must fail)
        run: |
          for canary in blocking_file_io_inside_a_real_time_section_is_caught \
                        waiting_on_a_held_lock_inside_a_real_time_section_is_caught \
                        an_allocation_inside_a_real_time_section_is_caught; do
            if out=$(cargo test --locked -p lumen-rt --test rtsan_canary -- --ignored --exact "$canary" 2>&1); then
              echo "$out"
              echo "RTSan did not catch $canary: the sanitizer is not active"
              exit 1
            fi
            if ! grep -q "ERROR: RealtimeSanitizer" <<< "$out"; then
              echo "$out"
              echo "$canary failed, but not because of RTSan"
              exit 1
            fi
            echo "OK: RTSan caught $canary"
          done

  deny:
    name: licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
