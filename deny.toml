# cargo-deny policy. Run locally with `cargo deny check`.
# Dependency licensing rules are recorded in docs/DECISIONS.md (ADR-0013).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. Anything else (weak copyleft, font licenses,
# GPL) needs a recorded decision before it is added here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are unpublished and have no license field until ADR-0012 is decided.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
