[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "transitive via winit Wayland decorations; no maintained alternative upstream yet" },
    { id = "RUSTSEC-2026-0372", reason = "transitive via accesskit_unix (zbus 5); no safe upgrade available yet" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, transitive via accesskit_unix (zbus 5); no safe upgrade available yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, transitive via accesskit_unix (zbus 5); no safe upgrade available yet" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[[licenses.exceptions]]
crate = "symphonia"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-core"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-common"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-metadata"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-format-riff"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-format-ogg"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-codec-pcm"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-codec-vorbis"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-bundle-flac"
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "symphonia-bundle-mp3"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "midly"
allow = ["Unlicense"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
