<script>
window.onerror = (m, s, l, c, e) => { const d = document.getElementById('err'); d.style.display = 'block'; d.textContent += m + ' @' + l + ':' + c + '\n' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join('\n') : '') + '\n'; };
// ============================================================================
// Round 4 · the faces' pitch. One page, no network. Canvas 2D stands in for
// egui's painter: every shape here is a line, polygon, arc, disc, a vertical or
// radial gradient, or an additive blend (egui: Mesh with vertex colours).
// ============================================================================
const Q = new URLSearchParams(location.search);
const ST = {
  S: Math.max(.5, Math.min(3, +(Q.get('scale') || 1))),
  light: Q.has('light'),
  signal: Q.get('signal') || 'drums',
  reduce: Q.has('reduce'),
  freeze: Q.has('freeze') ? +(Q.get('freeze') || 2.4) : null,
  paused: false,
};
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

// ---------- tokens: design/theme.rs DARK and LIGHT (docs/DESIGN.md §3) ----------
const D = {app:'#17191D',canvas:'#1B1D22',raised:'#23262D',overlay:'#262A31',control:'#31353E',
 control_hi:'#383C46',border:'#2E323A',border_strong:'#3C414B',text:'#E6E8EC',text2:'#9AA0AC',hint:'#6E7480',
 accent:'#4FA3FF',accent_muted:'#243A55',on_accent:'#06182E',well:'#141619',ground:'#111316'};
const L = {app:'#F1F2F4',canvas:'#FAFAFB',raised:'#E9EBEE',overlay:'#FFFFFF',control:'#E2E5E9',
 control_hi:'#EEF0F3',border:'#DADDE2',border_strong:'#C3C8CF',text:'#1C1F24',text2:'#5A6170',hint:'#878D98',
 accent:'#1F6FD1',accent_muted:'#D5E5FA',on_accent:'#FFFFFF',well:'#D6DAE0',ground:'#E7E9ED'};
let C = ST.light ? L : D;
// theme::personality
const HUE = {iris:'#7C8CFF',gravity:'#B46CFF',horizon:'#FF8A4C',parallax:'#3FD6C6',afterglow:'#FF6FA8',flare:'#FFC23D',prism:'#9AA0AC'};
const HUE2 = {iris:'#4A55C8',gravity:'#7A35C8',horizon:'#C4561F',parallax:'#178F84',afterglow:'#C23A74',flare:'#B07A00',prism:'#5A6170'};
const DEEP = {iris:'#0B0D18',gravity:'#0B0912',horizon:'#0E0810',parallax:'#07100F',afterglow:'#120910',flare:'#110D05',prism:'#0C0E12'};
const SWEEP = ['#FF5A6E','#FFB547','#5BE07F','#4FA3FF','#B07CFF'];
const BANDS = ['#FF5A6E','#FFB547','#E6D64A','#5BE07F','#3FD6C6','#4FA3FF','#B07CFF','#E26FD0'];

// ---------- small helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rgb(hex) { if (hex[0] === 'r') return hex.match(/\d+(\.\d+)?/g).slice(0, 3).map(Number); if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3]; const n = parseInt(hex.slice(1, 7), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const hexA = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${clamp(a)})`; };
function mixc(a, b, t) { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
const dbOf = x => 20 * Math.log10(Math.max(1e-6, x));
const fmtDb = (d, p = 1) => (d < 0 ? '−' : d > 0 ? '+' : '') + Math.abs(d).toFixed(p);

// ============================================================================
// THE MOTION VOCABULARY (proposed tokens for design/motion.rs; see round4-notes.md)
// Existing: FAST .10, BASE .18, GLIDE .22, spring() = critically damped, no
// overshoot, ease_out(). New names below are proposals; nothing is edited.
// ============================================================================
const MO = {
  // follower time constants (seconds): 1 - exp(-dt / tau) per frame
  METER_ATTACK: .004, METER_RELEASE: .16,
  PEAK_HOLD: .70, PEAK_FALL: 1.1,          // picture units per second after the hold
  FLASH_RISE: .010, FLASH_TAU: .12,         // an impulse: rises in a frame, falls like a decay
  // rest and wake
  SILENCE_DB: -66, SLEEP_HOLD: .45, SLEEP_TAU: .30, WAKE_TAU: .05,
  // springs {omega rad/s, zeta}
  SNAP: {w: 46, z: .55},   // ~12 % overshoot: a handle, a dial head, a node
  POP:  {w: 34, z: .38},   // ~28 % overshoot: one hero beat (a ball landing)
  SOFT: {w: 32, z: 1.0},   // = today's spring(): critically damped, no overshoot
  // glow, as a share of full: rest, live (+ energy), hit
  GLOW_REST: .10, GLOW_LIVE: .30, GLOW_ENERGY: .50, GLOW_HIT: 1.0,
  DT_MAX: 1 / 20,
};
const ease = {
  out: t => { const u = 1 - clamp(t); return 1 - u * u * u; },
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t)),
  outBack: t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  inOut: t => { t = clamp(t); return t * t * t * (t * (t * 6 - 15) + 10); },
};
// Ballistic follower: fast up, eased down, frame-rate independent.
function follow(cur, target, tauUp, tauDown, dt) {
  const tau = target > cur ? tauUp : tauDown;
  return tau <= 0 ? target : cur + (target - cur) * (1 - Math.exp(-dt / tau));
}
// A spring with sub-stepping so a slow frame cannot change its shape.
class Spring {
  constructor(kind = MO.SNAP, x = 0) { this.k = kind; this.x = x; this.v = 0; this.target = x; }
  set(t) { this.target = t; }
  snap(x) { this.x = this.target = x; this.v = 0; }
  step(dt) {
    if (ST.reduce) { this.x = this.target; this.v = 0; return this.x; }
    const {w, z} = this.k; let n = Math.max(1, Math.ceil(dt / .004)); const h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = -w * w * (this.x - this.target) - 2 * z * w * this.v;
      this.v += a * h; this.x += this.v * h;
    }
    return this.x;
  }
}
// Peak hold with a fall.
class Peak {
  constructor() { this.v = 0; this.age = 0; }
  step(x, dt) {
    if (x >= this.v) { this.v = x; this.age = 0; }
    else { this.age += dt; if (this.age > MO.PEAK_HOLD) this.v = Math.max(x, this.v - MO.PEAK_FALL * dt); }
    return this.v;
  }
}

// ============================================================================
// THE SIMULATED SIGNAL. Silence, a drum loop's envelopes, a sustained pad.
// Stands for the track meter, the analyser, and the note stream. Deterministic.
// ============================================================================
const SIG = {
  mode: ST.signal, T: 0, bpm: 100, frame: 0, events: [],
  kick: 0, snare: 0, hat: 0, pad: 0, padGate: 0, level: 0, awake: 0, quiet: 9,
  bands: new Float32Array(64), mid: 0, side: 0,
  notes: [], // sounding notes {n, vel, t0, off}
  step(dt) {
    dt = Math.min(dt, MO.DT_MAX);
    const b0 = this.T * this.bpm / 60; this.T += dt; const b1 = this.T * this.bpm / 60;
    this.events = this.carry || []; this.carry = []; this.frame++;
    const m = this.mode;
    if (m === 'drums') {
      for (let s = Math.floor(b0 * 4) + 1; s <= Math.floor(b1 * 4); s++) this.onStep(s);
    } else if (m === 'pad') {
      for (let k = Math.floor(b0 / 8) + 1; k <= Math.floor(b1 / 8); k++) {
        [45, 52, 55, 60, 64].forEach((n, i) => this.noteOn(n, .55 + .05 * i, k * 8 + i * .06, 6.2));
        this.events.push({type: 'pad', beat: k * 8});
      }
      if (this.T < dt * 2 && b0 === 0) { // first chord at once
        [45, 52, 55, 60, 64].forEach((n, i) => this.noteOn(n, .55 + .05 * i, 0, 6.2));
        this.events.push({type: 'pad', beat: 0});
      }
    }
    // note-offs
    for (const n of this.notes) if (n.off == null && b1 >= n.beatOff) { n.off = this.T; this.events.push({type: 'noteOff', n: n.n}); }
    this.notes = this.notes.filter(n => n.off == null || this.T - n.off < 4);
    // envelopes
    this.kick *= Math.exp(-dt / .11); this.snare *= Math.exp(-dt / .09); this.hat *= Math.exp(-dt / .035);
    const gate = m === 'pad' && this.notes.some(n => n.off == null) ? 1 : 0;
    this.pad = follow(this.pad, gate, 1.1, 1.5, dt);
    if (m === 'silence') { this.kick = this.snare = this.hat = 0; this.pad = follow(this.pad, 0, .01, .05, dt); }
    // level: the instantaneous peak the meter would read
    const wob = m === 'pad' ? .04 * Math.sin(this.T * 1.7) : 0;
    this.level = clamp(Math.max(this.kick * .97, this.snare * .86, this.hat * .46) + this.pad * (.58 + wob));
    this.mid = clamp(this.kick * 1 + this.snare * .7 + this.hat * .25 + this.pad * .5);
    this.side = clamp(this.snare * .3 + this.hat * .9 + this.pad * .7);
    // rest: below SILENCE_DB for SLEEP_HOLD, then the faces settle
    if (dbOf(this.level) > MO.SILENCE_DB + 20) this.quiet = 0; else this.quiet += dt;
    const awakeT = this.quiet < MO.SLEEP_HOLD ? 1 : 0;
    this.awake = follow(this.awake, awakeT, MO.WAKE_TAU, MO.SLEEP_TAU, dt);
    this.spectrum();
  },
  onStep(s) {
    const st = ((s % 16) + 16) % 16, beat = s / 4;
    const kick = [0, 6, 10].includes(st), snare = [4, 12].includes(st), hat = st % 2 === 0;
    if (kick) { this.kick = .95; this.events.push({type: 'kick', vel: .95, beat, pan: 0}); }
    if (snare) { this.snare = .86; this.events.push({type: 'snare', vel: .86, beat, pan: -.45}); }
    if (hat) { const v = st % 4 === 2 ? .85 : .55; this.hat = Math.max(this.hat, v * .5); this.events.push({type: 'hat', vel: v, beat, pan: .5}); }
    // a plucky line for the synths, over the drums
    const line = {0: 45, 3: 57, 6: 52, 8: 48, 10: 57, 12: 55, 14: 52};
    if (line[st] != null) this.noteOn(line[st], .5 + .4 * hash(s), beat, .42);
  },
  noteOn(n, vel, beat, dur) {
    this.notes.push({n, vel, t0: this.T, off: null, beatOff: beat + dur});
    this.events.push({type: 'noteOn', n, vel});
  },
  spectrum() {
    const B = this.bands, g = (i, c, w) => Math.exp(-((i - c) * (i - c)) / (2 * w * w));
    const pos = f => Math.log(f / 20) / Math.log(1000) * 63;
    for (let i = 0; i < 64; i++) {
      let a = 0;
      a += this.kick * (g(i, pos(58), 3.2) * .95 + g(i, pos(2800), 4) * .12);
      a += this.snare * (g(i, pos(190), 4.5) * .7 + sstep(pos(900), pos(2500), i) * (1 - sstep(pos(9000), pos(16000), i)) * .55);
      a += this.hat * sstep(pos(5000), pos(9000), i) * .8;
      if (this.pad > .002) for (const n of this.notes) {
        const f0 = 440 * Math.pow(2, (n.n - 69) / 12);
        for (let k = 1; k <= 10; k++) a += this.pad * .16 * g(i, pos(k * f0), .9) / Math.pow(k, .9);
      }
      // a real analyser flickers between frames
      a *= .8 + .4 * hash(i * 13.7 + this.frame * 1.31);
      B[i] = clamp(a);
    }
  },
  warm(sec) { const n = Math.round(sec * 120); for (let i = 0; i < n; i++) this.step(1 / 120); },
  setMode(m) {
    this.mode = m; this.notes = []; this.quiet = 0;
    if (m === 'silence') { this.kick = this.snare = this.hat = 0; }
    this.carry = [];
    if (m === 'pad') { const b = this.T * this.bpm / 60; [45, 52, 55, 60, 64].forEach((n, i) => this.noteOn(n, .55 + .05 * i, b + i * .06, 6.2)); this.carry = this.events.splice(0); this.carry.push({type: 'pad', beat: b}); }
  },
};

// ============================================================================
// Canvas kit and the card framework (chrome, screen, lit dials, interaction)
// ============================================================================
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function glowDisc(ctx, x, y, r, col, a = 1) {
  if (r <= 0.5 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(col, a)); g.addColorStop(.35, hexA(col, a * .42));
  g.addColorStop(.7, hexA(col, a * .1)); g.addColorStop(1, hexA(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function pathPts(ctx, pts, close = false) { // a smooth line through points (midpoint quadratics)
  if (pts.length < 2) return;
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1]; ctx.lineTo(l[0], l[1]);
}
function polyline(ctx, pts) { ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); }
function text(ctx, s, x, y, {font = '10px Inter', col = '#fff', a = 1, align = 'left', base = 'alphabetic', ls = 0} = {}) {
  ctx.font = font; ctx.fillStyle = col; ctx.globalAlpha = a; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.letterSpacing = ls ? ls + 'px' : '0px'; ctx.fillText(s, x, y); ctx.globalAlpha = 1; ctx.letterSpacing = '0px';
}
const MONO = '9px "Mono"', UNB = '560 15px Unbounded';
function addBlend(ctx, on) { ctx.globalCompositeOperation = on ? 'lighter' : 'source-over'; }

// ---------- parameters (visual stand-ins: a value 0..1, a default, its words) ----------
function P(name, v, fmt) { return {name, v, def: v, s: v, spring: new Spring(MO.SNAP, v), fmt}; }
const f_pct = v => Math.round(v * 100) + '%';
const f_db = (lo, hi) => v => fmtDb(lo + (hi - lo) * v) + ' dB';
const f_hz = (lo, hi) => v => { const f = lo * Math.pow(hi / lo, v); return f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 0 : 1) + 'k' : Math.round(f) + ''; };
const f_ms = (lo, hi) => v => { const t = lo * Math.pow(hi / lo, v); return t >= 1000 ? (t / 1000).toFixed(1) + ' s' : (t >= 100 ? Math.round(t) : t.toFixed(t < 10 ? 1 : 0)) + ' ms'; };
const ms_of = (lo, hi, v) => lo * Math.pow(hi / lo, v);

// ---------- the card ----------
const CARDS = [];
class Card {
  constructor(o) {
    Object.assign(this, {w: 300, h: 330, screenH: 176, hue: '#fff', hue2: '#888', deep: '#0C0E12', name: '', sub: '', params: {}, dials: [], pills: [], regions: [], extraH: 0}, o);
    this.power = new Spring(MO.SOFT, 1); this.on = true;
    this.canvas = document.createElement('canvas'); this.canvas.className = 'cv';
    this.ctx = this.canvas.getContext('2d');
    this.visible = true; this.t = 0; this.hit = []; this.drag = null; this.hoverId = null;
    this.size(); CARDS.push(this);
    this.canvas.addEventListener('pointerdown', e => this.down(e));
    this.canvas.addEventListener('pointermove', e => this.move(e));
    this.canvas.addEventListener('pointerup', e => this.up(e));
    this.canvas.addEventListener('pointerleave', () => { this.hoverId = null; });
    this.canvas.addEventListener('dblclick', e => this.dbl(e));
    this.canvas.addEventListener('wheel', e => this.wheel(e), {passive: false});
    if (this.init) this.init();
  }
  size() {
    const px = ST.S * DPR; this.canvas.width = Math.round(this.w * px); this.canvas.height = Math.round(this.h * px);
    this.canvas.style.width = this.w * ST.S + 'px'; this.canvas.style.height = this.h * ST.S + 'px';
  }
  pt(e) { const r = this.canvas.getBoundingClientRect(); return [(e.clientX - r.left) / ST.S, (e.clientY - r.top) / ST.S]; }
  pick(x, y) { // topmost hit region
    for (let i = this.hit.length - 1; i >= 0; i--) { const h = this.hit[i]; if (h.test(x, y)) return h; }
    return null;
  }
  down(e) {
    const [x, y] = this.pt(e), h = this.pick(x, y); if (!h) return;
    this.canvas.setPointerCapture(e.pointerId);
    if (h.kind === 'power') { this.on = !this.on; this.power.set(this.on ? 1 : 0); return; }
    if (h.click) h.click(x, y, e);
    if (h.kind === 'dial' || h.kind === 'drag') this.drag = {h, x, y, v0: h.key ? this.params[h.key].v : 0};
  }
  move(e) {
    const [x, y] = this.pt(e);
    if (this.drag) {
      const d = this.drag, h = d.h;
      if (h.drag) h.drag(x, y, e, d); else {
        const p = this.params[h.key], k = e.shiftKey ? 1200 : 160;
        p.v = clamp(d.v0 + (d.y - y) / k); p.s = p.v; p.spring.snap(p.v);
      }
    } else { const h = this.pick(x, y); this.hoverId = h ? h.id : null; this.canvas.style.cursor = h ? (h.kind === 'dial' ? 'ns-resize' : 'pointer') : 'default'; }
  }
  up() { this.drag = null; }
  dbl(e) { const [x, y] = this.pt(e), h = this.pick(x, y); if (h && h.key) { const p = this.params[h.key]; p.v = p.def; p.spring.set(p.def); } }
  wheel(e) {
    const [x, y] = this.pt(e), h = this.pick(x, y);
    if (h && h.key) { e.preventDefault(); const p = this.params[h.key]; p.v = clamp(p.v - Math.sign(e.deltaY) * (e.shiftKey ? .005 : .03)); p.spring.snap(p.v); p.s = p.v; }
    else if (h && h.wheel) { e.preventDefault(); h.wheel(e); }
  }

  // ---- chrome ----
  chrome(ctx) {

// ============================================================================
// HORIZON (limiter) · 300 x 330, screen 272 x 176
// What the real card gets: Scene.level (0..1), Scene.reading (gain reduction),
// Scene.mist (the "present" fade). The simulation below recomputes a limiter

// ============================================================================
const HZ_TOP = 4, HZ_BOT = -36; // dB at the screen's top and bottom

  c.grS = follow(c.grS, c.gr, MO.METER_ATTACK, .12, dt); // the readout's ballistics

// ---------- A · Skyline: the level history as a soft area, the ceiling as the horizon ----------
function HorizonA() {
  return new Card({...hzBase, params: hzParams(), init() { this.N = 137; limInit(this); limDials(this); },
    drawScreen(ctx, e) {
      const {w, h} = e, c = this, aw = e.awake, rest = e.rest;

      let g = ctx.createLinearGradient(0, yc, 0, yc + 78); g.addColorStop(0, hexA(HUE.horizon, MO.GLOW_REST + .3 * glow + .1 * aw)); g.addColorStop(1, hexA(HUE.horizon, 0));

      hzReadout(ctx, c, e, w, w - 10, 38);

      ctx.save(); ctx.globalAlpha = rest * .45; ctx.setLineDash([2, 5]); ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.moveTo(8, h - 12); ctx.lineTo(w - 8, h - 12); ctx.stroke(); ctx.restore();

// ---------- B · Dawn: the level rides an arc; the limiter holds the sun at the horizon notch ----------
function HorizonB() {
  return new Card({...hzBase, params: hzParams(), init() { limInit(this); limDials(this); this.rise = new Spring(MO.SNAP, 0); },
    drawScreen(ctx, e) {
      const {w, h} = e, c = this, aw = e.awake; limStep(c, e.dt);
      const cx = w / 2, cy = h - 20, R = 100, ang = db => Math.PI + clamp((db - HZ_BOT) / (HZ_TOP - HZ_BOT)) * Math.PI;

        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.stroke();
        text(ctx, fmtDb(d, 0), t[0], t[1] + 3, {font: '8px "Mono"', col: '#fff', a: .32, align: 'center'}); }

        ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI, aOut); ctx.lineWidth = 9; ctx.strokeStyle = hexA(HUE.horizon, .85); ctx.stroke(); ctx.restore();
        ctx.save(); ctx.globalAlpha = aw; ctx.beginPath(); ctx.arc(cx, cy, R, Math.max(Math.PI, aOut - .35), aOut); ctx.lineWidth = 9; ctx.strokeStyle = '#FFE0C6'; ctx.stroke(); ctx.restore();

// ---------- C · Bars: a skyline of light, the peaks that pressed the ceiling capped in white ----------
function HorizonC() {

    drawScreen(ctx, e) {

// ============================================================================
// GRAVITY (compressor) · 380 x 330, screen 352 x 176
// Real card data: Scene.level, Scene.reading (gain reduction; exists), the
// params. Below, a soft-knee compressor is simulated from the signal.
// ============================================================================
const grParams = () => ({
  pull: P('Pull', .60, v => fmtDb(-45 * (1 - v), 0) + ' dB'),
  ratio: P('Ratio', .45, v => (1 + 15 * v * v).toFixed(1) + ':1'),
  attack: P('Attack', .2, f_ms(.5, 50)), release: P('Release', .5, f_ms(10, 1000)), makeup: P('Makeup', .7, () => 'auto'),
});
const grBase = {w: 380, name: 'Gravity', sub: 'Compressor', hue: HUE.gravity, hue2: HUE2.gravity, deep: DEEP.gravity,
  dials: [{key: 'pull', name: 'Pull'}, {key: 'ratio', name: 'Ratio'}, {key: 'attack', name: 'Attack'}, {key: 'release', name: 'Release'}, {key: 'makeup', name: 'Makeup'}]};
const KNEE = 6;
function compGR(inDb, thr, ratio) {
  const o = inDb - thr, k = 1 - 1 / ratio;
  if (o <= -KNEE / 2) return 0;
  if (o >= KNEE / 2) return k * o;
  return k * (o + KNEE / 2) * (o + KNEE / 2) / (2 * KNEE);
}
function compInit(c) { c.gr = 0; c.grS = 0; c.inS = -60; c.outS = -60; c.prevGr = 0; c.dGR = 0; c.flash = 0; c.pk = new Peak(); c.grPk = 0; }
function compStep(c, dt) {
  const thr = -45 * (1 - c.params.pull.v), ratio = 1 + 15 * c.params.ratio.v ** 2;
  const att = ms_of(.5, 50, c.params.attack.v) / 1000, rel = ms_of(10, 1000, c.params.release.v) / 1000;
  const inDb = SIG.level > .004 ? -44 + 46 * SIG.level : -60;
  c.prevGr = c.gr; c.gr = follow(c.gr, compGR(inDb, thr, ratio), att, rel, dt);
  c.dGR = (c.gr - c.prevGr);
  c.grS = follow(c.grS, c.gr, .006, .10, dt);
  c.inS = follow(c.inS, inDb, MO.METER_ATTACK, MO.METER_RELEASE, dt); c.outS = follow(c.outS, inDb - c.gr, MO.METER_ATTACK, MO.METER_RELEASE, dt);
  c.flash = Math.max(c.flash * Math.exp(-dt / MO.FLASH_TAU), clamp(c.dGR * 14));
  c.thr = thr; c.ratio = ratio; c.grPk = c.pk.step(clamp(c.gr / 18), dt);
}
const grChip = (ctx, h) => {
  rr(ctx, 12, h - 30, 150, 20, 10); ctx.fillStyle = '#0B0912'; ctx.fill(); ctx.strokeStyle = hexA(HUE.gravity, .6); ctx.lineWidth = 1; ctx.stroke();
  text(ctx, 'Keyed by Kick · post', 22, h - 16, {font: '10px Inter', col: '#fff', a: .85});
};
const grReadout = (ctx, c, e, x, y, align = 'right') => {
  const aw = e.awake;
  text(ctx, fmtDb(-c.grS), x, y, {font: '600 26px Unbounded', col: '#fff', a: .35 + .65 * aw * clamp(c.grS / 1.5) + .0, align});
  text(ctx, c.grS > .05 ? 'dB pulled' : 'dB · at rest', x, y + 16, {font: '9px "Mono"', col: HUE.gravity, a: .5 + .5 * aw, align});
};

// ---------- A · Well: the grid is a real membrane, the ball drops, and a hit sends rings across it ----------
function GravityA() {
  const NX = 23, NY = 12;
  return new Card({...grBase, params: grParams(), init() {
    compInit(this); this.hh = new Float32Array(NX * NY); this.vv = new Float32Array(NX * NY); this.ballY = new Spring(MO.POP, 0); this.sq = 0; this.lastBy = 0; this.rem = 0;
  }, drawScreen(ctx, e) {
    const {w, h} = e, c = this, aw = e.awake; compStep(c, e.dt);
    const D = clamp(c.gr / 16), A = 40, cxg = (NX - 1) / 2, cyg = 6.2;
    // the membrane: h' = c2 lap(h) - k (h - well) - d v, in fixed steps so a slow frame cannot blow it up
    c.rem += e.dt; const st = 1 / 120; let n = 0;
    if (c.dGR > .7 && !e.still) { for (let j = 5; j <= 7; j++) for (let i = 10; i <= 12; i++) c.vv[j * NX + i] -= c.dGR * 2.4; }
    while (c.rem >= st && n++ < 8) {
      c.rem -= st;
      for (let j = 1; j < NY - 1; j++) for (let i = 1; i < NX - 1; i++) {
        const k = j * NX + i, dx = (i - cxg) / 3.3, dy = (j - cyg) / 2.5, g = -D * Math.exp(-(dx * dx + dy * dy));
        const lap = c.hh[k - 1] + c.hh[k + 1] + c.hh[k - NX] + c.hh[k + NX] - 4 * c.hh[k];
        c.vv[k] += (1500 * lap - 42 * (c.hh[k] - g) - 5 * c.vv[k]) * st;
      }
      for (let k = 0; k < c.hh.length; k++) c.hh[k] += c.vv[k] * st;
    }
    if (c.rem > st * 8) c.rem = 0;
    const pt = (i, j) => { const t = j / (NY - 1), s = .5 + .5 * Math.pow(t, .8), yR = 22 + 150 * Math.pow(t, 1.35), hv = c.hh[j * NX + i];
      return [w / 2 + (i - cxg) * 15.5 * s, yR - hv * A * (.45 + .55 * t)]; };
    const ctr = pt(11, 6), mem = (i, j) => Math.min(1, Math.abs(c.hh[j * NX + i]) * 2.2);
    // glow in the well
    glowDisc(ctx, ctr[0], ctr[1] + 10, 120, HUE.gravity, .10 + .18 * aw + .3 * D);
    ctx.lineJoin = 'round'; ctx.lineWidth = 1;
    for (let j = 0; j < NY; j++) { const t = j / (NY - 1); ctx.beginPath(); const pts = []; for (let i = 0; i < NX; i++) pts.push(pt(i, j)); pathPts(ctx, pts);
      let m = 0; for (let i = 0; i < NX; i++) m = Math.max(m, mem(i, j)); ctx.strokeStyle = hexA(HUE.gravity, (.10 + .22 * t) + .5 * m); ctx.stroke(); }
    for (let i = 0; i < NX; i += 1) { ctx.beginPath(); const pts = []; for (let j = 0; j < NY; j++) pts.push(pt(i, j)); pathPts(ctx, pts);
      let m = 0; for (let j = 0; j < NY; j++) m = Math.max(m, mem(i, j)); ctx.strokeStyle = hexA(HUE.gravity, .10 + .5 * m); ctx.stroke(); }
    // the event horizon: the threshold ring, lit as the ball drops through it
    const rx = 54 + 40 * (1 - c.params.pull.v), ry = rx * .3;
    ctx.save(); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = hexA('#E9D4FF', .22 + .6 * clamp(c.flash + D * .5)); ctx.beginPath(); ctx.ellipse(ctr[0], ctr[1] + 8, rx, ry, 0, 0, 6.2832); ctx.stroke(); ctx.restore();
    text(ctx, fmtDb(c.thr, 0) + ' dB', ctr[0] + rx + 6, ctr[1] + 12, {font: '8.5px "Mono"', col: '#E9D4FF', a: .55});
    // the ball: it rests on the membrane, springs down by the pull, rebounds on release
    c.ballY.set(aw < .05 ? -12 : 0); const by = c.ballY.step(e.dt);
    const vy = (ctr[1] - c.lastBy) / Math.max(e.dt, 1e-3); c.lastBy = ctr[1]; c.sq = follow(c.sq, clamp(vy / 260, -.28, .28), .02, .05, e.dt);
    const bx = ctr[0], byy = ctr[1] - 2 + by, sy = 1 + (e.still ? 0 : c.sq), sx = 1 / sy, br = 15;
    glowDisc(ctx, bx, byy, 44 + 30 * D + 16 * c.flash, HUE.gravity, .5 + .4 * c.flash);
    ctx.save(); ctx.translate(bx, byy); ctx.scale(sx, sy);
    const bg = ctx.createRadialGradient(-4, -5, 1, 0, 0, br); bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(.35, '#E9D4FF'); bg.addColorStop(1, HUE.gravity);
    ctx.beginPath(); ctx.arc(0, 0, br, 0, 6.2832); ctx.fillStyle = bg; ctx.fill(); ctx.restore();
    grReadout(ctx, c, e, w - 14, 34); grChip(ctx, h);
    text(ctx, 'nothing to pull', w - 14, 66, {font: '8.5px "Mono"', col: '#E9D4FF', a: e.rest * .6, align: 'right'});
  }});
}

// ---------- B · Slope: the transfer curve, a bead riding it, the pulled amount as a lit bracket ----------
function GravityB() {
  return new Card({...grBase, params: grParams(), init() { compInit(this); this.trail = []; this.tk = 0; this.pop = new Spring(MO.POP, 0); },
  drawScreen(ctx, e) {
    const {w, h} = e, c = this, aw = e.awake; compStep(c, e.dt);
    const X0 = 28, X1 = 186, Y0 = 156, Y1 = 14, xo = d => X0 + (d + 48) / 48 * (X1 - X0), yo = d => Y0 - (d + 48) / 48 * (Y0 - Y1);
    // grid
    for (let d = -48; d <= 0; d += 12) { ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(xo(d), Y1, 1, Y0 - Y1); ctx.fillRect(X0, yo(d), X1 - X0, 1); if (d < 0) text(ctx, fmtDb(d, 0), xo(d), Y0 + 11, {font: '8px "Mono"', col: '#fff', a: .3, align: 'center'}); }

    const pts = []; for (let d = -48; d <= 0; d += 1) pts.push([xo(d), yo(d - compGR(d, c.thr, c.ratio))]);

    const pg = ctx.createLinearGradient(0, Y1, 0, Y0); pg.addColorStop(0, hexA(HUE.gravity, .38)); pg.addColorStop(1, hexA(HUE.gravity, .04)); ctx.fillStyle = pg; ctx.fill();
    ctx.save(); ctx.shadowColor = HUE.gravity; ctx.shadowBlur = 6; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.lineWidth = 2.2; ctx.strokeStyle = '#D8B5FF'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
    // threshold: a lit tick on the in axis that can be dragged

    ctx.save(); ctx.setLineDash([2, 3]); ctx.strokeStyle = hexA('#E9D4FF', .35); ctx.beginPath(); ctx.moveTo(tx, Y0); ctx.lineTo(tx, yo(c.thr)); ctx.stroke(); ctx.restore();
    c.hit.push({id: 'thr', kind: 'drag', test: (x, y) => Math.abs(x - 14 - tx) < 9 && y - 60 > Y0 - 6 && y - 60 < Y0 + 14, drag: (x) => { const d = clamp((x - 14 - X0) / (X1 - X0)) * 48 - 48; const p = c.params.pull; p.v = clamp(1 + d / 45); p.spring.snap(p.v); }});
    // the bead and its comet
    c.tk += e.dt; if (c.tk > .028) { c.tk = 0; c.trail.push([c.inS, c.outS]); if (c.trail.length > 26) c.trail.shift(); }
    if (c.dGR > .6) c.pop.x = Math.min(1.6, c.pop.x + .9 * clamp(c.dGR * 2)); c.pop.set(0); const pp = c.pop.step(e.dt);
    if (aw > .02) {
      c.trail.forEach(([i, o], k) => { const a = (k / c.trail.length) ** 2 * .5 * aw; glowDisc(ctx, xo(Math.min(0, i)), yo(Math.min(0, o)), 5, '#E9D4FF', a); });
      const bi = clamp(c.inS, -48, 0), bo = clamp(c.outS, -48, 0), bx = xo(bi), by = yo(bo), uy = yo(bi);
      if (c.gr > .1) { ctx.save(); ctx.setLineDash([2, 2]); ctx.strokeStyle = '#fff'; ctx.globalAlpha = .75 * aw; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, uy); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#fff'; ctx.fillRect(bx - 4, uy - .5, 8, 1.2); ctx.restore(); }
      glowDisc(ctx, bx, by, 18 + 14 * c.flash, HUE.gravity, aw * (.7 + .3 * c.flash));
      ctx.beginPath(); ctx.arc(bx, by, 4.2 + 2.6 * pp, 0, 6.2832); ctx.fillStyle = '#fff'; ctx.globalAlpha = aw; ctx.fill(); ctx.globalAlpha = 1;
    } else { ctx.beginPath(); ctx.arc(xo(-47), yo(-47), 3.5, 0, 6.2832); ctx.fillStyle = hexA('#fff', .35); ctx.fill(); }
    // the right column: the number, the in and out, a meter that falls from the top

    text(ctx, 'in  ' + fmtDb(clamp(c.inS, -60, 0)) + ' dB', 214, 96, {font: MONO, col: '#fff', a: .35 + .5 * aw});
    text(ctx, 'out ' + fmtDb(clamp(c.outS, -60, 0)) + ' dB', 214, 110, {font: MONO, col: '#E9D4FF', a: .35 + .5 * aw});
    text(ctx, c.ratio.toFixed(1) + ':1 over ' + fmtDb(c.thr, 0), 214, 130, {font: '8.5px "Mono"', col: HUE.gravity, a: .8});

    const mh = 148 * clamp(c.grS / 18); if (mh > 1) { rr(ctx, 326, 14, 10, mh, 5); const mg = ctx.createLinearGradient(0, 14, 0, 14 + mh); mg.addColorStop(0, '#E9D4FF'); mg.addColorStop(1, HUE.gravity); ctx.fillStyle = mg; ctx.fill(); }

  }});

// ---------- C · Press: a lit ball squashed by a plate; the squash is the gain reduction ----------
function GravityC() {
  return new Card({...grBase, params: grParams(), init() { compInit(this); this.ry = new Spring(MO.POP, 34); this.rings = []; this.rest = 0; },
  drawScreen(ctx, e) {
    const {w, h} = e, c = this, aw = e.awake; compStep(c, e.dt);
    const cx = w / 2 + 6, floor = 140, R = 34, gn = clamp(c.gr / 14);
    c.ry.set(R - 20 * gn); const ry = Math.max(10, c.ry.step(e.dt)), rx = Math.min(70, R * Math.sqrt(R / ry)), cy = floor - ry;
    if (c.dGR > .6 && c.rings.length < 4 && !e.still) c.rings.push({t: 0, a: clamp(c.dGR * 2) });
    // the floor, its light and rings
    ctx.save(); ctx.translate(cx, floor); ctx.scale(1, .22); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 150); g.addColorStop(0, hexA(HUE.gravity, .26 + .2 * aw)); g.addColorStop(1, hexA(HUE.gravity, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 150, 0, 6.2832); ctx.fill(); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(10, floor, w - 20, 1);
    c.rings.forEach(r => { r.t += e.dt; const p = ease.outExpo(r.t / .6); ctx.beginPath(); ctx.ellipse(cx, floor + 1, 30 + 130 * p, 5 + 30 * p, 0, 0, 6.2832); ctx.lineWidth = 1.4; ctx.strokeStyle = hexA('#E9D4FF', r.a * (1 - p) * .8); ctx.stroke(); });
    c.rings = c.rings.filter(r => r.t < .6);
    // the plate: it comes down to meet the ball; the threshold is where it rests
    const plate = cy - ry - 3; ctx.save(); ctx.shadowColor = HUE.gravity; ctx.shadowBlur = 4 + 10 * gn;
    rr(ctx, cx - 62, plate - 5, 124, 5, 2.5); const pgd = ctx.createLinearGradient(0, plate - 5, 0, plate); pgd.addColorStop(0, hexA('#E9D4FF', .9)); pgd.addColorStop(1, hexA(HUE.gravity, .8)); ctx.fillStyle = pgd; ctx.fill(); ctx.restore();
    for (const sx of [-52, 52]) { ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(cx + sx - 1, 18, 2, plate - 22); }
    // the shadow and the ball
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, floor + 3, rx * .95, 4 + 2 * gn, 0, 0, 6.2832); ctx.fill(); ctx.restore();
    glowDisc(ctx, cx, cy, 52 + 34 * gn, HUE.gravity, .55 * (.4 + .6 * aw) + .4 * c.flash);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(rx / R, ry / R);
    const bg = ctx.createRadialGradient(-10, -13, 2, 0, 0, R); bg.addColorStop(0, '#FFFFFF'); bg.addColorStop(.3, '#E9D4FF'); bg.addColorStop(1, mixc(HUE.gravity, '#4A1F8A', .35 * gn));
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fillStyle = bg; ctx.fill(); ctx.restore();
    // level columns: what comes in, what leaves
    const col = (x, v, lab) => { rr(ctx, x, 30, 8, 108, 4); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill(); const f = clamp((v + 48) / 48); if (f > .01) { rr(ctx, x, 30 + 108 * (1 - f), 8, 108 * f, 4); ctx.fillStyle = hexA(HUE.gravity, .85); ctx.fill(); } text(ctx, lab, x + 4, 150, {font: '8px "Mono"', col: '#fff', a: .4, align: 'center'}); };
    col(14, c.inS, 'in'); col(w - 22, c.outS, 'out');
    grReadout(ctx, c, e, w - 36, 34);
  }});
}

// ============================================================================
// PRISM (utility) · 300 x 290, screen 272 x 136
// Real card data: Scene.level, the four dials, polarity. A stereo picture
// (correlation, side energy) would be one new reading from the engine; the
// fan and the ribbons need only the level.
// ============================================================================
const pmParams = () => ({
  gain: P('Gain', .5, v => fmtDb(-18 + 36 * v)), pan: P('Pan', .5, v => Math.abs(v - .5) < .01 ? 'C' : (v < .5 ? 'L' : 'R') + Math.round(Math.abs(v - .5) * 200)),
  width: P('Width', .65, v => Math.round(v * 200) + '%'), bass: P('Bass mono', .3, v => '<' + Math.round(40 + v * 267)),

const pmBase = {w: 300, h: 290, screenH: 136, name: 'Prism', sub: 'Utility · gain, width, mono', hue: HUE.prism, hue2: HUE2.prism, deep: DEEP.prism, init() { this.flash = 0; this.lv = 0; this.pol = true; this.bloom = new Spring(MO.POP, 0); this.hist = []; },
  drawDials(ctx) {
    this.dialRow(ctx, [{key: 'gain', name: 'Gain'}, {key: 'pan', name: 'Pan'}, {key: 'width', name: 'Width', hue: '#B07CFF'}, {key: 'bass', name: 'Bass mono'},
      {pill: true, id: 'pol', label: () => 'Ø L', on: () => this.pol, click: () => { this.pol = !this.pol; }, w: 40}], {x0: 44, x1: 256, cy: 60 + 136 + 40, r: 14});
  }};
function pmLevel(c, dt) { c.lv = follow(c.lv, SIG.level, MO.METER_ATTACK, MO.METER_RELEASE, dt); c.flash = Math.max(c.flash * Math.exp(-dt / MO.FLASH_TAU), SIG.level > .6 ? 1 : 0); }
const pmGain = c => Math.pow(10, (-18 + 36 * c.params.gain.v) / 20);
const BEAMS = ['#FF5A6E', '#FFB547', '#5BE07F', '#4FA3FF', '#B07CFF'];

// ---------- A · Fan: a real prism; the light leaves in five wedges that add back to white at 0 % ----------
function PrismA() {
  return new Card({...pmBase, params: pmParams(), drawScreen(ctx, e) {
    const {w, h} = e, c = this, aw = e.awake; pmLevel(c, e.dt);
    const gain = clamp(Math.pow(pmGain(c), .6), .25, 1.4), spread = c.params.width.v * .17, pan = (c.params.pan.v - .5) * 2;
    const px = w * .33, py = h / 2 + pan * 12, ent = [px - 12, py + 12], O = [px + 13, py + 10], stem = 4 + c.params.bass.v * 34;
    const O2 = [O[0] + stem, O[1] - stem * .02], Lb = w - 6 - O2[0], live = .14 + .6 * aw + .3 * aw * c.lv, a = clamp(live * gain);
    // light in
    ctx.save(); addBlend(ctx, true);
    let g = ctx.createLinearGradient(0, 0, ent[0], 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${.35 + .6 * a})`);
    ctx.fillStyle = g; ctx.fillRect(0, ent[1] - 1.8, ent[0], 3.6);
    glowDisc(ctx, ent[0] - 10, ent[1], 16 + 10 * c.lv, '#fff', .25 * a);

      const tip = [O2[0] + dx * Lb, O2[1] + dy * Lb], gg = ctx.createLinearGradient(O2[0], 0, tip[0], 0);
      gg.addColorStop(0, hexA(col, .78 * a)); gg.addColorStop(.55, hexA(col, .42 * a)); gg.addColorStop(1, hexA(col, .06 * a));
      ctx.beginPath(); ctx.moveTo(O2[0], O2[1] - 1.2); ctx.lineTo(tip[0] + nx * wd, tip[1] + ny * wd); ctx.lineTo(tip[0] - nx * wd, tip[1] - ny * wd); ctx.lineTo(O2[0], O2[1] + 1.2); ctx.closePath(); ctx.fillStyle = gg; ctx.fill();
      ctx.beginPath(); ctx.moveTo(O2[0], O2[1]); ctx.lineTo(tip[0], tip[1]); ctx.lineWidth = 1.4; ctx.strokeStyle = hexA(col, .95 * a); ctx.stroke();
      // light packets running down the beam: they are the signal
      if (aw > .02 && !e.still) for (let k = 0; k < 2; k++) {
        const s = ((e.T * 150 + i * 31 + k * Lb * .5) % Lb) / Lb, x = O2[0] + dx * Lb * s, y = O2[1] + dy * Lb * s;

// ============================================================================
// PARALLAX (delay). The picture is a function of the SONG CLOCK, not of the

function paWords(ctx, c, e) {
  const p = c.params; text(ctx, 'L', 10, 15, {font: '9px "Mono"', col: HUE.parallax, a: .8}); text(ctx, 'R', e.w - 16, 15, {font: '9px "Mono"', col: HUE.parallax, a: .8});
  text(ctx, p.sync.v > .5 ? PNOTES[pIdx(p.time.v)][0] : Math.round(c.dly * 1000) + ' ms', e.w - 12, e.h - 9, {font: '560 13px Unbounded', col: '#fff', a: .95, align: 'right'});

// ---- A · Court (keeps today's floor and lanes; adds the flying ball) ----
function ParallaxA() {
  return new Card({...paBase(), init() { this.hits = []; this.params._bind(this); this.sync = () => this.params.sync.v > .5; },
  drawScreen(ctx, e) {
    const c = this, {T, dly, fb, n} = paStep(c, e), w = e.w, h = e.h, vpY = 28, floorY = h - 10, cx = w / 2, hue = HUE.parallax;
    const near = i => .86 - i * Math.min(1 / 8.2, .8 / (n - 1)); // slot i's depth, as today
    const yOf = d => vpY + (floorY - vpY) * Math.pow(d, 1.5), sOf = d => .3 + .7 * Math.pow(d, 1.2);
    const at = (d, side) => [cx + side * (w * .5 - 22) * (.25 + .7 * c.laneW * 1.4) * sOf(d), yOf(d)];
    // the floor
    ctx.lineWidth = 1; for (let i = -4; i <= 4; i++) { ctx.beginPath(); ctx.moveTo(cx, vpY); ctx.lineTo(cx + i * w * .13, h); ctx.strokeStyle = hexA(hue, .12); ctx.stroke(); }

      ctx.beginPath(); ctx.ellipse(sl.x, sl.y + r * .55, r * 1.05, r * .3, 0, 0, 6.2832); ctx.fillStyle = hexA('#000', .35); ctx.fill();
      ctx.save(); addBlend(ctx, true); glowDisc(ctx, sl.x, sl.y, r * (1.8 + 2.2 * lit[i]), hue, base + .75 * lit[i]); ctx.restore();
      ctx.beginPath(); ctx.arc(sl.x, sl.y, r * .5, 0, 6.2832); ctx.fillStyle = hexA('#D8FFF8', .22 + base * 1.6 + lit[i]); ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = hexA(hue, .3 + .6 * lit[i]); ctx.stroke(); }

// ---- B · Zigzag: the same schedule on a flat ladder; one row per echo ----
function ParallaxB() {

  drawScreen(ctx, e) {

}

  {label: 'A1 · Bloom', make: AfterglowA, rec: 'it keeps today’s glow and rings but lets each hit throw a ring outward (fast start, long ease) so the tail you hear is a ring you watch leaving. Cheapest to build.', text: 'Kicks throw a ring, snares a warmer one, a pad chord one long slow ring. The glow swells with the level and falls at the real decay time (the hero number). Warmth tints rings from cool white to amber as they age.', needs: 'Painter: one gradient mesh, up to a handful of ring strokes. Needs level and the hit onsets (a rising level read; no new engine data).'},
  {label: 'A2 · Motes', make: AfterglowB, text: 'The same glow with the tail as light dust that drifts out and goes dark, each mote living a share of the decay. Richer, fuller, costs more (up to 130 small discs).', needs: 'Painter: one mesh of small quads with vertex colours (one draw). Needs level and onsets.'}]},
 {title: 'Parallax · delay (with ping-pong)', blurb: 'OR-9: keep it, add L/R ping-pong, and say how the picture stays in step with the repeats. <b>How it stays in step.</b> The picture is not animated by the frame; it is computed from the song clock. Each input hit is stored with its time; echo <i>i</i> is due at <code>hit + (i + 1) · delay</code>; the ball for that echo flies for exactly one delay interval and lands on the due instant, so a landing flash, squash and ripple are pure functions of <code>now − due</code> (no state to drift, any frame rate). With Sync the delay is note-length × the project tempo; without it, the milliseconds. The clock is the audio frame count read with the meter (minus the output latency), so a pause, loop or tempo change moves the picture with the audio. The ping switch slides the lanes, not jumps them.', options: [
  {label: 'A · Court', make: ParallaxA, rec: 'it keeps today’s floor, lanes and light, and adds one thing: a ball that bounces from slot to slot, left then right, landing exactly when each echo sounds.', text: 'Echoes sit on a floor that recedes to a vanishing point, alternating L and R. A hit sends a ball that arcs L, R, L… deeper each time; every landing squashes the slot (spring), flashes it and sends a ripple. Slots show what feedback leaves of each echo. Ping off: the ball bounces straight down the middle. Drag across for Time, up for Feedback.', needs: 'Painter: ellipses, glow discs, lines. Needs input onsets and the audio clock with the meter read (one new field; today’s card uses wall time). Without them: onsets from the level stream, accurate to a meter frame.'},
  {label: 'B · Zigzag', make: ParallaxB, text: 'The same schedule on a flat ladder: one row per echo, the ball zigzags between the L and R posts. Easiest to read, least depth.', needs: 'Painter: lines, discs. Same data as A.'}]},
];
window.FOOT = '<p><b>Not shown.</b> Real audio: the signal is simulated (a drum loop at 100 bpm, a pad, silence) and stands for the meter, the analyser and the note stream. Real egui rendering: the page uses Canvas 2D, whose lines, polygons, arcs, discs, gradients and additive blends map to egui’s painter shapes and vertex-coloured meshes; nothing here needs a custom shader. Cost: each face’s drawing is budgeted under 0.3 ms a frame (see the notes); the page itself was not timed in egui. Real hardware latency, the engine reads listed under each card, and Reduce motion beyond a static picture were not tested.</p>';

// ============================================================================
// The page: toolbar, the motion vocabulary, one section per device
// ============================================================================
const SECTIONS = window.SECTIONS || [];
const el = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'html') e.innerHTML = attrs[k]; else if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } [].concat(kids).forEach(k => k && e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k)); return e; };
const root = document.getElementById('root');

function applyTheme() {
  C = ST.light ? L : D;
  document.body.style.background = C.ground; document.body.style.color = C.text;
  document.querySelectorAll('.seg').forEach(s => s.style.background = C.well);
  document.querySelectorAll('.seg button').forEach(b => { const on = b.dataset.on === '1'; b.style.background = on ? (ST.light ? '#fff' : C.control_hi) : 'transparent'; b.style.color = on ? C.text : C.text2; b.style.fontWeight = on ? 600 : 400; });
  document.querySelectorAll('.tog').forEach(b => { const on = b.dataset.on === '1'; b.style.background = on ? C.accent_muted : C.well; b.style.color = on ? C.accent : C.text2; });
  document.querySelectorAll('.sub').forEach(s => s.style.color = C.text2);
  document.querySelectorAll('.chip.rec').forEach(s => { s.style.background = C.accent_muted; s.style.color = C.accent; });
  document.querySelectorAll('.chip.plain').forEach(s => { s.style.background = C.well; s.style.color = C.text2; });
  document.querySelectorAll('.bar').forEach(b => b.style.background = C.ground);
  document.querySelectorAll('th,td.k').forEach(s => s.style.color = C.text2);
  document.querySelectorAll('td').forEach(s => { if (!s.classList.contains('k')) s.style.color = C.text; });
  document.querySelectorAll('.vocab').forEach(v => { v.style.background = C.raised; v.style.border = '1px solid ' + C.border; });
}
function applyScale() { document.documentElement.style.setProperty('--s', ST.S); CARDS.forEach(c => c.size()); VOCAB.size(); }
function seg(label, items, get, set) {
  const wrap = el('div', {class: 'grp'}, [el('span', {}, label)]), s = el('div', {class: 'seg'}); wrap.appendChild(s);
  const paint = () => [...s.children].forEach((b, i) => b.dataset.on = get() === items[i][1] ? '1' : '0');
  items.forEach(([t, v]) => { const b = el('button', {}, t); b.onclick = () => { set(v); paint(); applyTheme(); refreshFrame(); }; s.appendChild(b); }); paint(); return wrap;
}
function tog(label, get, set) {
  const b = el('button', {class: 'tog'}, label); b.dataset.on = get() ? '1' : '0';
  b.onclick = () => { set(!get()); b.dataset.on = get() ? '1' : '0'; applyTheme(); refreshFrame(); }; return b;
}
function refreshFrame() { if (ST.paused || ST.freeze != null) tickAll(1 / 240); }

// ---------- the motion vocabulary panel ----------
const VOCAB = {
  w: 1276, h: 232, canvas: null, ctx: null, t: 0, raw: [], sym: [], ar: [], aw: [], flip: 0, tgt: 0,
  sp: [new Spring(MO.SOFT), new Spring(MO.SNAP), new Spring(MO.POP)], sA: 0, sB: 0, awake: 0,
  size() { const px = ST.S * DPR; this.canvas.width = Math.round(this.w * px); this.canvas.height = Math.round(this.h * px); this.canvas.style.width = this.w * ST.S + 'px'; this.canvas.style.height = this.h * ST.S + 'px'; },
  init() { this.canvas = el('canvas', {class: 'cv'}); this.ctx = this.canvas.getContext('2d'); this.size(); return this.canvas; },
  frame(dt) {
    const ctx = this.ctx, px = ST.S * DPR; ctx.setTransform(px, 0, 0, px, 0, 0); ctx.clearRect(0, 0, this.w, this.h);
    this.t += dt; rr(ctx, 0, 0, this.w, this.h, 12); ctx.fillStyle = C.raised; ctx.fill(); ctx.strokeStyle = C.border; ctx.stroke();
    const col = HUE.flare, pw = 300, x0 = 20;
    // 1 · springs
    this.flip -= dt; if (this.flip <= 0) { this.flip = 1.5; this.tgt = 1 - this.tgt; this.sp.forEach(s => s.set(this.tgt)); this.t0 = this.t; }
    this.sp.forEach(s => s.step(dt));
    text(ctx, 'Springs', x0, 26, {font: UNB.replace('15', '12'), col: C.text});
    text(ctx, 'one step, three ways of arriving', x0, 41, {font: '10px Inter', col: C.text2});
    [['SOFT · today, no overshoot', 0], ['SNAP · ζ .55, ~12 %', 1], ['POP · ζ .38, ~28 %', 2]].forEach(([n, i]) => {
      const y = 78 + i * 46, a = x0, b = x0 + 250;
      ctx.fillStyle = hexA(C.text2, .25); ctx.fillRect(a, y, 250, 2); ctx.fillRect(a, y - 6, 1, 14); ctx.fillRect(b, y - 6, 1, 14);
      const x = lerp(a, b, this.sp[i].x); glowDisc(ctx, x, y + 1, 12, col, .5); ctx.beginPath(); ctx.arc(x, y + 1, 5, 0, 6.2832); ctx.fillStyle = col; ctx.fill();
      text(ctx, n, a, y + 20, {font: '8.5px "Mono"', col: C.text2});
    });
    // 2 · meter ballistics, on the live signal
    const bx = 350; this.raw.push(SIG.level); this.sA = follow(this.sA, SIG.level, .08, .08, dt); this.sB = follow(this.sB, SIG.level, MO.METER_ATTACK, MO.METER_RELEASE, dt);
    this.sym.push(this.sA); this.ar.push(this.sB); [this.raw, this.sym, this.ar].forEach(a => { while (a.length > 150) a.shift(); });
    text(ctx, 'Meter ballistics', bx, 26, {font: UNB.replace('15', '12'), col: C.text});
    text(ctx, 'fast attack, eased release (green) vs symmetric', bx, 41, {font: '10px Inter', col: C.text2});
    const gy = 56, gh = 118, gw = 250;
    ctx.save(); rr(ctx, bx, gy, gw, gh, 8); ctx.fillStyle = C.well; ctx.fill(); ctx.clip();
    const plot = (arr, colr, wd, fill) => { ctx.beginPath(); arr.forEach((v, i) => { const x = bx + 4 + i / 150 * (gw - 8), y = gy + gh - 6 - v * (gh - 14); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.lineWidth = wd; ctx.strokeStyle = colr; ctx.stroke(); };
    plot(this.raw, hexA(C.text2, .55), 1); plot(this.sym, '#E26F6F', 1.4); plot(this.ar, '#5BE07F', 2); ctx.restore();
    text(ctx, 'raw', bx, gy + gh + 14, {font: '8.5px "Mono"', col: C.text2}); text(ctx, 'tau .08 both ways (lifeless)', bx + 30, gy + gh + 14, {font: '8.5px "Mono"', col: '#E26F6F'});
    text(ctx, 'tau 4 ms up / 160 ms down', bx, gy + gh + 28, {font: '8.5px "Mono"', col: '#2FB65A'});
    // 3 · rest and wake
    const rx = 660; this.awake = SIG.awake;
    text(ctx, 'Rest and wake', rx, 26, {font: UNB.replace('15', '12'), col: C.text});
    text(ctx, 'silent for .45 s: settle; a hit: wake in 50 ms', rx, 41, {font: '10px Inter', col: C.text2});
    const cx = rx + 70, cy = 112, aw = this.awake;
    glowDisc(ctx, cx, cy, 46 + 26 * aw * (.4 + SIG.level), col, MO.GLOW_REST + (MO.GLOW_LIVE - MO.GLOW_REST) * aw + MO.GLOW_ENERGY * SIG.level * aw);
    ctx.beginPath(); ctx.arc(cx, cy, 6 + 3 * aw, 0, 6.2832); ctx.fillStyle = mixc('#8a7a55', '#FFF3D1', aw); ctx.fill();
    text(ctx, aw < .08 ? 'resting · nothing repaints' : 'awake · ' + (aw > .95 ? 'drawing' : 'waking'), cx, cy + 66, {font: '9px "Mono"', col: C.text2, align: 'center'});
    this.aw.push(aw); while (this.aw.length > 130) this.aw.shift();
    ctx.beginPath(); this.aw.forEach((v, i) => { const x = rx + 150 + i / 130 * 130, y = 170 - v * 70; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke();
    ctx.fillStyle = hexA(C.text2, .25); ctx.fillRect(rx + 150, 170, 130, 1); text(ctx, 'awake', rx + 150, 186, {font: '8.5px "Mono"', col: C.text2});
    // 4 · easing and glow
    const ex = 990; text(ctx, 'Curves and glow', ex, 26, {font: UNB.replace('15', '12'), col: C.text});
    text(ctx, 'ease_out today; back and expo are new', ex, 41, {font: '10px Inter', col: C.text2});
    [[ease.out, '#9AA0AC', 'out'], [ease.outBack, HUE.flare, 'out_back'], [ease.outExpo, '#5BE07F', 'out_expo']].forEach(([f, cc, n], k) => {
      ctx.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 40, x = ex + t * 120, y = 140 - f(t) * 58; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.lineWidth = 1.6; ctx.strokeStyle = cc; ctx.stroke();
      text(ctx, n, ex + 128, 90 + k * 12, {font: '8.5px "Mono"', col: cc});
    });
    ctx.fillStyle = hexA(C.text2, .25); ctx.fillRect(ex, 140, 120, 1); ctx.fillRect(ex, 82, 120, 1);
    [['rest', MO.GLOW_REST], ['live', MO.GLOW_LIVE + .15], ['hit', MO.GLOW_HIT]].forEach(([n, a], i) => { const x = ex + 24 + i * 78; ctx.fillStyle = '#0E0B07'; rr(ctx, x - 26, 160, 52, 52, 10); ctx.fill(); glowDisc(ctx, x, 186, 24, col, a); ctx.beginPath(); ctx.arc(x, 186, 3, 0, 6.2832); ctx.fillStyle = '#fff'; ctx.fill(); text(ctx, n + ' ' + a.toFixed(2).replace(/^0/, ''), x, 224, {font: '8.5px "Mono"', col: C.text2, align: 'center'}); });
  },
};

function build() {
  root.appendChild(el('h1', {html: 'Faces, round 4 <small>M8 pitch · OR-2, OR-3, OR-5, OR-6, OR-7, OR-9</small>'}));
  root.appendChild(el('p', {class: 'lead sub', html: 'Every card below is live and at its real size. Pick a signal, turn Reduce motion on, scale to 150 or 200 %, drag a dial, a node or a line. Each device has two or three directions; one is marked <b>Recommended</b>. All are drawn with lines, polygons, arcs, discs, gradients and additive blends: <b>none needs a shader</b> (the card that comes closest says so).'}));
  const bar = el('div', {class: 'bar'}, [
    seg('Theme', [['Dark', false], ['Light', true]], () => ST.light, v => ST.light = v),
    seg('Scale', [['100%', 1], ['150%', 1.5], ['200%', 2]], () => ST.S, v => { ST.S = v; applyScale(); }),
    seg('Signal', [['Silence', 'silence'], ['Drum loop', 'drums'], ['Sustained pad', 'pad']], () => SIG.mode, v => SIG.setMode(v)),
    tog('Reduce motion', () => ST.reduce, v => ST.reduce = v),
    tog('Pause', () => ST.paused, v => ST.paused = v),
  ]); root.appendChild(bar);

  // vocabulary
  const vs = el('div'); vs.appendChild(el('h2', {html: 'Shared motion vocabulary'}));
  vs.appendChild(el('p', {class: 'lead sub', html: 'One kit for every face (and for Shutter and the chain after them). Tokens, how audio drives them, and the rest state are in <code>round4-notes.md</code> §2. Below: the pieces running on the live signal.'}));
  const vc = VOCAB.init(); vc.className = 'cv vocab'; vs.appendChild(vc); root.appendChild(vs);

  for (const sec of SECTIONS) {
    const h2 = el('h2', {html: sec.title}); root.appendChild(h2);
    root.appendChild(el('p', {class: 'lead sub', html: sec.blurb}));
    const row = el('div', {class: 'row'});
    for (const o of sec.options) {
      const card = o.make(); const fig = el('figure'); fig.style.width = card.w * ST.S + 'px'; fig.dataset.w = card.w;
      fig.appendChild(el('div', {class: 'cap'}, [el('b', {}, o.label), o.rec ? el('span', {class: 'chip rec'}, 'Recommended') : null, o.tag ? el('span', {class: 'chip plain'}, o.tag) : null]));
      fig.appendChild(card.canvas);
      fig.appendChild(el('div', {class: 'note sub', html: (o.rec ? '<b>Why: </b>' + o.rec + '<br>' : '') + o.text + '<i>' + o.needs + '</i>'}));
      row.appendChild(fig); card.fig = fig;
    }
    root.appendChild(row);
  }
  const f = el('div', {class: 'note sub', html: '<h2>What this page does not show</h2>' + (window.FOOT || '')}); root.appendChild(f);
  applyTheme();
}

let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 1000, MO.DT_MAX); last = now;
  if (!ST.paused && ST.freeze == null) { tickAll(dt); VOCAB.frame(dt); }
  requestAnimationFrame(loop);
}
Promise.all(['560 15px Unbounded', '11px Inter', '600 11px Inter', '9px Mono'].map(f => document.fonts.load(f))).catch(() => {}).then(() => {
  build(); applyScale();
  const io = new IntersectionObserver(es => es.forEach(e => { const c = CARDS.find(c => c.canvas === e.target); if (c) c.visible = e.isIntersecting; }), {rootMargin: '200px'});
  CARDS.forEach(c => io.observe(c.canvas));
  SIG.setMode(ST.signal);
  document.querySelectorAll('.seg').forEach(s => { /* paint the signal choice */ });
  if (ST.freeze != null) { // a deterministic still: run the simulation, then stop
    const n = Math.round(ST.freeze * 60); for (let i = 0; i < n; i++) { tickAll(1 / 60); VOCAB.frame(1 / 60); }
    document.title += ' [still]';
  }
  applyTheme(); requestAnimationFrame(loop);
});

</script></body></html>
