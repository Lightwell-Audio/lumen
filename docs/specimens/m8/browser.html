<!doctype html>
<!-- M8 OR-1 (owner chose A, 2026-11-14): built-ins live in the browser's Devices tab.
     Specimens of three ways to present them, the states, the new menus and Flare's
     preset menu. Self-contained: no network. Mock-ups drawn at the real panel width
     (260 pt, BROWSER_MIN 220), real row heights and tokens (theme.rs), not built UI.
     Query: ?theme=light  ?scale=1.5  ?dir=A|B|C  ?reduce -->
<html lang="en"><head><meta charset="utf-8"><title>Lumen M8 specimens: the browser's built-ins (OR-1)</title>
<style>
@font-face{font-family:Inter;src:url(../../../site/assets/fonts/Inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Unbounded;src:url(../../../site/assets/fonts/Unbounded.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(../../../site/assets/fonts/MartianMono.woff2) format("woff2");font-stretch:75% 112.5%}

:root,[data-theme=dark]{
 --app:#17191D;--canvas:#1B1D22;--raised:#23262D;--overlay:#262A31;--control:#31353E;--control-hi:#383C46;--control-press:#444A56;
 --border:#2E323A;--border-strong:#3C414B;--text:#E6E8EC;--text2:#9AA0AC;--hint:#6E7480;
 --accent:#4FA3FF;--accent-hi:#5DAEFF;--accent-lo:#3F8FEA;--on-accent:#06182E;--accent-muted:#243A55;
 --selected:#223449;--well:#14161A;--header:#1E2126;--ember:rgba(230,232,236,.08);--shadow:rgba(0,0,0,.38);--ground:#111316;
 --warning:#F2B14C;--record:#E5484D;--edge:rgba(255,255,255,.07);--mark:rgba(229,72,77,.16);--new:rgba(79,163,255,.16)}
[data-theme=light]{
 --app:#F1F2F4;--canvas:#FAFAFB;--raised:#E9EBEE;--overlay:#FFFFFF;--control:#E2E5E9;--control-hi:#EEF0F3;--control-press:#CBD0D7;
 --border:#DADDE2;--border-strong:#C3C8CF;--text:#1C1F24;--text2:#5A6170;--hint:#878D98;
 --accent:#1F6FD1;--accent-hi:#2A74D4;--accent-lo:#1A62BD;--on-accent:#FFFFFF;--accent-muted:#D5E5FA;
 --selected:#DBE7F8;--well:#D6DAE0;--header:#ECEEF1;--ember:rgba(28,31,36,.08);--shadow:rgba(28,31,36,.14);--ground:#E7E9ED;
 --warning:#A86400;--record:#D33A40;--edge:rgba(255,255,255,.8);--mark:rgba(211,58,64,.12);--new:rgba(31,111,209,.12)}

*{box-sizing:border-box}
body{margin:0;padding:0 32px 60px;font-family:Inter,sans-serif;font-size:13px;background:var(--ground);color:var(--text);width:1480px}
h1{font-family:Unbounded;font-weight:560;font-size:22px;margin:0 0 6px}
h2{font-family:Unbounded;font-weight:560;font-size:16px;margin:38px 0 4px}
h3{font-size:13px;font-weight:600;margin:0 0 2px}
p.q{margin:0 0 12px;font-size:13px;max-width:1150px;line-height:1.5;color:var(--text)}
p.q.small{font-size:12px;color:var(--text2)}
code{font-family:Mono;font-stretch:87.5%;font-size:11px;background:var(--control);padding:1px 4px;border-radius:3px}
.bar{position:sticky;top:0;z-index:50;background:var(--ground);padding:14px 0 12px;display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:18px}
.bar .grp{display:flex;gap:4px;align-items:center}
.bar .lab{font-size:11px;color:var(--text2);margin-right:4px}
.pill{border:0;background:var(--control);color:var(--text2);font:inherit;font-size:12px;padding:4px 11px;border-radius:12px;cursor:pointer}
.pill.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.cap{font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.note{font-size:11.5px;line-height:1.45;color:var(--text2);max-width:260px}
.note b{color:var(--text)}
.badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.badge.alt{background:var(--control);color:var(--text2)}
.dir{width:392px}
.dir ul{margin:6px 0 0;padding-left:16px;font-size:12px;line-height:1.5;color:var(--text2)}
.dir ul b{color:var(--text)}
.dirhead{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.dirhead .nm{font-family:Unbounded;font-weight:560;font-size:15px}
.rec{background:var(--accent-muted);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;max-width:1150px;font-size:12.5px;line-height:1.5;margin:10px 0 4px}

/* ---- the UI itself: zoomed by the scale control ---- */
.ui{zoom:var(--s,1);font-family:Inter,sans-serif;font-size:13px;color:var(--text);position:relative}
.pane{width:260px;height:var(--h,760px);background:var(--canvas);border:1px solid var(--border);border-radius:12px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.pane.w220{width:220px}
.pane .title{font-family:Unbounded;font-weight:560;font-size:16px;padding:12px 12px 8px}
.pane .inset{padding:0 12px}
.seg{display:flex;background:var(--well);border-radius:7px;padding:2px;gap:2px;height:24px}
.seg>div{flex:1;display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:5px;color:var(--text2);white-space:nowrap}
.seg>div.on{background:var(--control-hi);color:var(--text);box-shadow:inset 0 1px 0 var(--edge),0 1px 2px var(--shadow)}
.seg svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.seg>div.on svg{stroke:var(--accent)}
.tabline{font-size:11px;color:var(--text2);padding:4px 12px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabline b{color:var(--text);font-weight:500}
.search{margin:0 12px;height:30px;border-radius:6px;background:var(--well);box-shadow:inset 0 1px 2px var(--shadow);display:flex;align-items:center;padding:0 8px;gap:8px;color:var(--hint)}
.search svg{width:16px;height:16px;stroke:var(--hint);fill:none;stroke-width:1.4;stroke-linecap:round}
.search .tx{flex:1;color:var(--text);font-size:13px}
.search .tx.hintx{color:var(--hint)}
.search.focus{outline:2px solid var(--accent);outline-offset:0}
.search .x{font-size:12px;color:var(--hint)}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px}
.chip{height:20px;padding:0 8px;border-radius:10px;background:var(--control);color:var(--text2);font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:inset 0 1px 0 var(--edge)}
.chip.on{background:linear-gradient(var(--accent-hi),var(--accent-lo));color:var(--on-accent);font-weight:600}
.chip .dots{display:flex;gap:2px}.chip .dots i{width:4px;height:4px;border-radius:50%;display:block}
.scan{display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:11px;color:var(--hint);height:20px}
.scan u{text-decoration:none;color:var(--text2)}
.scan .warn{color:var(--warning)}
.gap4{height:4px;flex:none}.gap8{height:8px;flex:none}
.list{flex:1;overflow:hidden;position:relative;padding:0 8px}
.sect{height:24px;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--hint);margin-top:2px}
.sect::after{content:"";flex:1;height:1px;background:var(--border)}
.sect .dots{display:flex;gap:2px}.sect .dots i{width:5px;height:5px;border-radius:50%;display:block}
.vh{height:26px;display:flex;align-items:center;padding:0 6px;gap:6px;font-size:11px;font-weight:500;color:var(--text2);border-radius:6px}
.vh .ar{width:10px;height:10px;stroke:var(--hint);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vh .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh .c{font-family:Mono;font-stretch:87.5%;font-size:10px;color:var(--hint);padding-right:4px}
.vh.sel{background:var(--selected)}
.dv{display:flex;align-items:center;gap:8px;padding:0 6px;color:var(--text2);height:18px;font-size:10px;margin:2px 0 0;position:relative}
.dv span{font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hint)}
.dv::after{content:"";flex:1;height:1px;background:var(--border)}
.r{position:relative;display:flex;align-items:center;border-radius:6px;padding:0 6px;gap:8px}
.r.hover,.r:hover{background:var(--ember)}
.r.sel{background:var(--selected)}
.r.dim{opacity:.4}
.r .ic{width:16px;height:16px;flex:none;stroke:var(--text2);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.r .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r .nm mark,.r .tag mark,.r .ds mark{background:var(--accent-muted);color:var(--text);border-radius:2px;padding:0 1px}
.r .star{width:16px;height:16px;flex:none;stroke:var(--text2);fill:none;stroke-width:1.4;stroke-linejoin:round;opacity:0}
.r.hover .star,.r:hover .star,.r.sel .star{opacity:1}
.r .tag{font-size:10px;color:var(--hint);border:1px solid var(--border-strong);border-radius:4px;padding:0 4px;height:14px;line-height:12px;white-space:nowrap;flex:none}
.r.sel .tag{color:var(--text2);border-color:var(--text2)}
.r.p{height:28px}
.r.p .tag{opacity:0}.r.p.hover .tag,.r.p:hover .tag{opacity:1}
/* built-in rows */
.r.a{height:44px}
.r.a .bar3{width:3px;height:28px;border-radius:2px;flex:none}
.r.c{height:48px}
.r .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r .l1{display:flex;align-items:center;gap:6px;min-width:0}
.r .l1 .nm{flex:1}
.r .ds{font-size:11px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.sel .ds{color:var(--text2)}
.r.b{height:28px}
.r.b .dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.r.b .kind{font-size:11px;color:var(--hint);white-space:nowrap}
.r.b.hover .kind,.r.b:hover .kind{display:none}
.r.b .star{position:static}
.tile{width:36px;height:36px;flex:none;display:block;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.pane.w220 .tile{display:none}
.pane.w220 .r.c{height:44px}
.pane.w220 .r.c::before{content:"";width:3px;height:28px;border-radius:2px;background:var(--pc);flex:none}
/* tooltip (widgets::tip) */
.tip{position:absolute;left:40px;top:calc(100% - 2px);z-index:30;width:206px;background:var(--overlay);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;box-shadow:0 6px 18px var(--shadow);font-size:11px;line-height:1.4;color:var(--text2);pointer-events:none}
.tip b{display:block;color:var(--text);font-size:12px;font-weight:600;margin-bottom:2px}
.tip em{display:block;font-style:normal;color:var(--hint);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}
.tip .k{font-family:Mono;font-stretch:87.5%;font-size:9px;border:1px solid var(--border-strong);border-radius:3px;padding:0 3px;color:var(--text2)}
/* empty / safe notes */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 24px;margin-top:-30px}
.empty .t{font-size:13px;font-weight:600}.empty .h{font-size:11px;color:var(--text2);line-height:1.4}
.btn{height:24px;padding:0 12px;border-radius:6px;background:var(--control);box-shadow:inset 0 1px 0 var(--edge),0 1px 2px var(--shadow);font-size:12px;display:inline-flex;align-items:center;margin-top:6px;color:var(--text)}
.quiet{margin:6px 6px 0;padding:10px 12px;border-radius:8px;background:var(--header);border:1px solid var(--border);font-size:11px;line-height:1.45;color:var(--text2)}
.quiet b{display:block;color:var(--text);font-size:12px;font-weight:600;margin-bottom:2px}
.infoline{min-height:32px;padding-top:6px;padding-bottom:6px;margin-top:6px;border-radius:8px;background:var(--header);border:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--text2);gap:6px;flex-wrap:wrap;max-width:260px}
.infoline b{color:var(--text);font-weight:500}
.infoline .k{font-family:Mono;font-stretch:87.5%;font-size:9px;border:1px solid var(--border-strong);border-radius:3px;padding:0 3px}
/* drag */
.dragwrap{display:flex;position:relative}
.stub{width:210px;margin-left:-1px;height:var(--h,760px);border:1px solid var(--border);border-left:0;border-radius:0 12px 12px 0;background:var(--app);padding:12px 0 0}
.stub .tr{height:56px;display:flex;border-top:1px solid var(--border)}
.stub .th{width:88px;background:var(--header);padding:8px 8px;font-size:11px;color:var(--text2);border-right:1px solid var(--border)}
.stub .th b{display:block;color:var(--text);font-size:12px;font-weight:500}
.stub .ln{flex:1;background:var(--lane,var(--canvas));position:relative}
.stub .ln i{position:absolute;top:10px;height:36px;border-radius:4px;opacity:.9}
.stub .drop{outline:2px solid var(--accent);outline-offset:-2px;background:var(--new)}
.stub .hint{position:absolute;left:94px;right:6px;bottom:6px;font-size:10px;color:var(--text2);line-height:1.35}
.ghost{position:absolute;z-index:40;left:196px;top:var(--gy,330px);height:28px;border-radius:14px;background:var(--overlay);border:1px solid var(--accent);box-shadow:0 6px 16px var(--shadow);display:flex;align-items:center;gap:8px;padding:0 12px 0 8px;font-size:12px}
.ghost i{width:8px;height:8px;border-radius:50%;display:block}
.ghost .plus{font-size:11px;color:var(--accent);font-weight:700}
/* menus */
.menu{width:252px;background:var(--overlay);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 24px var(--shadow);padding:4px 0;font-size:13px;position:relative}
.mi{height:32px;display:flex;align-items:center;padding:0 12px;gap:8px;position:relative}
.mi .l{flex:1;white-space:nowrap}
.mi .ar{color:var(--hint);font-size:12px}
.mi .kc{font-family:Mono;font-stretch:87.5%;font-size:10px;color:var(--text2);border:1px solid var(--border-strong);border-radius:4px;padding:1px 5px}
.mi.gone{background:var(--mark);color:var(--text2)}
.mi.gone .l{text-decoration:line-through;text-decoration-color:var(--record)}
.mi.new{background:var(--new)}
.mi .why{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:8px}
.mi.gone .why{background:var(--record);color:#fff}.mi.new .why{background:var(--accent);color:var(--on-accent)}
.msep{height:1px;background:var(--border);margin:4px 8px}
.mgap{height:20px;display:flex;align-items:center;justify-content:center;color:var(--hint);letter-spacing:.3em;font-size:11px}
/* chain strip */
.chainbox{width:720px;background:var(--canvas);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative}
.chainbox .hd{font-size:11px;color:var(--text2);margin-bottom:8px;display:flex;gap:8px}
.chainbox .hd b{color:var(--text)}
.strip{display:flex;align-items:center;gap:10px;height:104px}
.cchip{height:24px;padding:0 10px;border-radius:12px;background:var(--control);font-size:11px;color:var(--text2);display:flex;align-items:center}
.cable{width:16px;height:2px;background:var(--border-strong);flex:none}
.card{width:150px;height:100px;border-radius:14px;background:var(--raised);border:1px solid var(--border);overflow:hidden;flex:none;box-shadow:0 1px 2px var(--shadow)}
.card .ch{height:34px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;background:linear-gradient(var(--tint),transparent)}
.card .ch b{font-family:Unbounded;font-weight:560;font-size:12px}
.card .ch span{font-size:10px;color:var(--text2)}
.card .cb{height:60px;margin:0 8px;border-radius:8px;background:#0C0E12;position:relative}
.slot{width:128px;height:100px;border-radius:14px;border:1.5px dashed var(--border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text2);font-size:11px;flex:none}
.slot b{font-size:20px;font-weight:300;line-height:1;color:var(--accent)}
.slot.hot{border-color:var(--accent);background:var(--new);color:var(--text)}
.emptychain{height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.emptychain .t{font-weight:600}.emptychain .h{font-size:11px;color:var(--text2)}
/* preset popover */
.pop{width:272px;background:var(--overlay);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 8px 24px var(--shadow);padding:8px}
.pop .search{margin:0 0 4px;height:28px}
.ph{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--hint);padding:8px 8px 3px}
.pi{height:28px;display:flex;align-items:center;padding:0 8px;border-radius:6px;gap:8px;font-size:13px}
.pi .ck{width:14px;color:var(--accent);font-size:12px}
.pi .sub{margin-left:auto;font-size:10px;color:var(--hint)}
.pi.cur{background:var(--selected)}
.pop .msep{margin:6px 0}
.cardmini{display:flex;gap:10px;align-items:flex-start}

/* hover animation of the glyphs (reduce motion turns it off) */
.r:hover .g-orb,.r.hover .g-orb{animation:bob 1.1s ease-in-out infinite}
.r:hover .g-node,.r.hover .g-node{animation:bob 1.3s ease-in-out infinite}
.r:hover .g-sun,.r.hover .g-sun{animation:rise 1.6s ease-in-out infinite}
.r:hover .g-echo,.r.hover .g-echo{animation:chase 1.2s linear infinite}
.r:hover .g-ring,.r.hover .g-ring{animation:ripple 1.6s ease-out infinite}
.r:hover .g-beam,.r.hover .g-beam{animation:beam 1.2s linear infinite}
.r:hover .g-wave,.r.hover .g-wave{animation:slide 1s linear infinite}
.g-orb,.g-node,.g-sun,.g-echo,.g-ring,.g-beam,.g-wave{transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(3px)}}
@keyframes rise{50%{transform:translateY(-2px)}}
@keyframes chase{0%{opacity:1}100%{opacity:.25}}
@keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes beam{to{stroke-dashoffset:-8}}
@keyframes slide{to{transform:translateX(-8px)}}
body.reduce *{animation:none!important}
</style></head>
<body data-theme="dark">
<div class="bar">
 <div class="grp"><span class="lab">Theme</span><button class="pill" data-set="theme=dark">Dark</button><button class="pill" data-set="theme=light">Light</button></div>
 <div class="grp"><span class="lab">Scale</span><button class="pill" data-set="scale=1">100%</button><button class="pill" data-set="scale=1.5">150%</button><button class="pill" data-set="scale=2">200%</button></div>
 <div class="grp"><span class="lab">States of direction</span><button class="pill" data-set="dir=A">A Shelf</button><button class="pill" data-set="dir=B">B Index</button><button class="pill" data-set="dir=C">C Tiles</button></div>
 <div class="grp"><span class="lab">Motion</span><button class="pill" data-set="reduce=0">On</button><button class="pill" data-set="reduce=1">Reduce</button></div>
</div>
<div id="root"></div>
<script>
/* ---------- state from the query ---------- */
const Q=new URLSearchParams(location.search);
const OPT={theme:Q.has('light')?'light':(Q.get('theme')||'dark'),scale:parseFloat(Q.get('scale')||'1'),dir:Q.get('dir')||'C',reduce:Q.get('reduce')==='1'||Q.has('reduce')&&Q.get('reduce')!=='0'};
function apply(){document.body.dataset.theme=OPT.theme;document.body.classList.toggle('reduce',OPT.reduce);document.documentElement.style.setProperty('--s',OPT.scale);
 document.querySelectorAll('[data-set]').forEach(b=>{const[k,v]=b.dataset.set.split('=');b.classList.toggle('on',String(OPT[k]===true?'1':OPT[k]===false?'0':OPT[k])===v)});}
document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{const[k,v]=b.dataset.set.split('=');OPT[k]=k==='scale'?parseFloat(v):k==='reduce'?v==='1':v;apply();if(k==='dir')render();}));

/* ---------- data (anonymous plugin labels, owner's naming rule) ---------- */
const LUMEN=[
 {id:'flare',name:'Flare',kind:'Polysynth',group:'Instruments',col:'#FFC23D',type:'Instrument',desc:'Two oscillators, filter, 16 voices',tip:'A warm polysynth: two oscillators, a filter and up to 16 voices. Five factory presets.'},
 {id:'gravity',name:'Gravity',kind:'Compressor',group:'Dynamics',col:'#B46CFF',type:'Effect',desc:'Pulls peaks down; sidechain-ready',tip:'A compressor that pulls peaks into a well. Sidechain from any track.'},
 {id:'horizon',name:'Horizon',kind:'Limiter',group:'Dynamics',col:'#FF8A4C',type:'Effect',desc:'A ceiling the peaks cannot pass',tip:'A limiter: the ceiling is the horizon. Look-ahead, with its latency reported.'},
 {id:'iris',name:'Iris',kind:'Parametric EQ',group:'EQ',col:'#7C8CFF',type:'Effect',desc:'Eight bands and a live analyzer',tip:'Eight bands (cuts, shelves, bells, notches) with a live analyzer.'},
 {id:'parallax',name:'Parallax',kind:'Stereo delay',group:'Time',col:'#3FD6C6',type:'Effect',desc:'Stereo echoes in notes or ms',tip:'A stereo delay in notes that follow the tempo, or in milliseconds. Ping-pong.'},
 {id:'afterglow',name:'Afterglow',kind:'Reverb',group:'Time',col:'#FF6FA8',type:'Effect',desc:'A tail that lingers and fades',tip:'A reverb: pre-delay, size, and a decay the tail really takes.'},
 {id:'prism',name:'Prism',kind:'Utility',group:'Utility',col:'#9AA0AC',type:'Effect',desc:'Gain, pan, width and polarity',tip:'Gain, pan, width, mono below a frequency, polarity, swap and a DC block.'}];
const GROUPS=['Instruments','Dynamics','EQ','Time','Utility'];
const PLUGINS=[
 {v:'Vendor A',items:[['RP-1 Bus Compressor','Effect','Dynamics'],['RP-2 Console EQ','Effect','EQ'],['RP-3 Tape Echo','Effect','Delay'],['RP-4 Plate Reverb','Effect','Reverb']]},

const NPLUG=PLUGINS.reduce((n,v)=>n+v.items.length,0);

/* ---------- little icons ---------- */
const I={
 keys:'<svg class="ic r-ic" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5.3 3v6M8 3v10M10.7 3v6"/></svg>',

 star:'<svg class="star" viewBox="0 0 16 16"><path d="M8 2l1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.2 4.3 13.3l.8-4.1L2 6.3l4.2-.5z"/></svg>',
 arrow:o=>`<svg class="ar" viewBox="0 0 10 10"><path d="${o?'M2 3.5l3 3 3-3':'M3.5 2l3 3-3 3'}"/></svg>`,
 search:'<svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>',

 wave:'<svg viewBox="0 0 14 14"><path d="M1 7h1.5l1.2-4 1.8 8 1.5-6 1.2 4 1-2H13"/></svg>',
 doc:'<svg viewBox="0 0 14 14"><path d="M3.5 1.5h5l2.5 2.5v8.5h-7.500z"/></svg>',
 folder:'<svg viewBox="0 0 14 14"><path d="M1.5 3.5h4l1.2 1.5h5.800v6.500h-11z"/></svg>',

/* ---------- glyph tiles: a still of each device's face, on its deep screen (round 2 / DESIGN 7k) ---------- */
const SCR='#0C0E12';
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const x=p(a),y=p(b);return '#'+x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join('');}
function glyph(d){
 const c=d.col,u='g'+d.id;
 const bg=base=>`<defs><linearGradient id="${u}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(base,c,.22)}"/><stop offset="1" stop-color="${base}"/></linearGradient></defs><rect width="36" height="36" rx="7" fill="url(#${u}b)"/>`;
 let s='';
 switch(d.id){
 case 'flare':s=bg('#110D05')+`<defs><radialGradient id="${u}r"><stop offset="0" stop-color="#FFE9A8"/><stop offset=".4" stop-color="${c}" stop-opacity=".5"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><circle class="g-orb" cx="27" cy="11" r="9" fill="url(#${u}r)"/><g clip-path="inset(0)"><path class="g-wave" d="M-4 27 L4 12 L4 27 L12 12 L12 27 L20 12 L20 27 L28 12 L28 27 L36 12 L36 27 L44 12" fill="none" stroke="${c}" stroke-width="1.7" stroke-linejoin="round"/></g>`;break;
 case 'iris':s=bg(SCR)+`<path d="M3 24 C9 22 11 26 16 22 S25 25 33 21" fill="none" stroke="${c}" stroke-opacity=".28" stroke-width="1"/><path d="M3 23 C10 23 12 11 18 11 S26 23 33 23" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><g class="g-node"><circle cx="18" cy="11" r="3.2" fill="${SCR}" stroke="#fff" stroke-width="1.4"/></g>`;break;
 case 'gravity':s=bg('#0B0912')+`<defs><radialGradient id="${u}r" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#E9D4FF"/><stop offset="1" stop-color="${c}"/></radialGradient></defs><path d="M3 8 C9 8 11 27 18 27 S27 8 33 8" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round"/><g class="g-orb"><circle cx="18" cy="22" r="4.6" fill="url(#${u}r)"/></g>`;break;
 case 'horizon':s=`<defs><linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A0F2A"/><stop offset=".55" stop-color="#5A2440"/><stop offset=".78" stop-color="#E0603A"/><stop offset="1" stop-color="#FFB86B"/></linearGradient><clipPath id="${u}k"><rect width="36" height="36" rx="7"/></clipPath></defs><g clip-path="url(#${u}k)"><rect width="36" height="24" fill="url(#${u}s)"/><g class="g-sun"><circle cx="18" cy="24" r="8" fill="#FFE3A8"/></g><rect y="24" width="36" height="12" fill="#120A16"/><rect y="23.4" width="36" height="1.2" fill="#FFE3A8"/></g>`;break;
 case 'parallax':s=bg('#07100F')+[[8,4,1],[15,3.3,.7],[22,2.6,.45],[29,1.9,.25]].map(([x,r,o],i)=>`<circle class="g-echo" style="animation-delay:${i*.2}s" cx="${x}" cy="18" r="${r}" fill="${c}" fill-opacity="${o}"/>`).join('')+`<path d="M8 18H31" stroke="${c}" stroke-opacity=".2" stroke-width="1"/>`;break;
 case 'afterglow':s=bg('#120910')+`<defs><radialGradient id="${u}r"><stop offset="0" stop-color="#FFF1D6"/><stop offset=".3" stop-color="${c}" stop-opacity=".85"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><circle cx="18" cy="18" r="15" fill="url(#${u}r)"/><circle class="g-ring" cx="18" cy="18" r="12" fill="none" stroke="${c}" stroke-opacity=".5" stroke-width="1"/><circle cx="18" cy="18" r="5" fill="#FFF1D6" fill-opacity=".9"/>`;break;
 case 'prism':s=bg(SCR)+`<path d="M3 18H14" stroke="#E6E8EC" stroke-width="1.6" stroke-linecap="round"/><path d="M14 11L22 18L14 25Z" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"/><g stroke-dasharray="4 4" stroke-width="1.5" stroke-linecap="round"><path class="g-beam" d="M22 18L33 9" stroke="#C8CCD4"/><path class="g-beam" d="M22 18H33" stroke="${c}"/><path class="g-beam" d="M22 18L33 27" stroke="#6E7480"/></g>`;break;
 }
 return `<svg class="tile" viewBox="0 0 36 36">${s}</svg>`;}

/* ---------- search ---------- */
const lc=s=>s.toLowerCase();
function hit(t,words){return !words||lc(t).includes(lc(words));}
function hl(t,words){if(!words)return t;const i=lc(t).indexOf(lc(words));return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+words.length)+'</mark>'+t.slice(i+words.length);}
const builtinsFor=s=>LUMEN.filter(d=>(!s.text||[d.name,d.kind,d.group,d.desc,d.type].some(x=>hit(x,s.text))));
const pluginsFor=s=>(s.lumenOnly||s.safe)?[]:PLUGINS.map(v=>({v:v.v,items:v.items.filter(p=>[p[0],v.v,p[2]].some(x=>hit(x,s.text)))})).filter(v=>v.items.length);

/* ---------- rows ---------- */
function tipHtml(d){return `<div class="tip"><b>${d.name} · ${d.kind}</b>${d.tip}<em>Double-click to add · drag to a track</em></div>`;}
function rowBuiltin(dir,d,s){
 const hov=s.hover===d.id,drag=s.drag===d.id,words=s.text;
 const cls=['r',dir==='A'?'a':dir==='B'?'b':'c',hov?'hover':'',drag?'dim':'',s.sel===d.id?'sel':''].join(' ');
 const kindTag=`<span class="tag">${hl(d.kind,words)}</span>`;
 if(dir==='B')return `<div class="${cls}" style="--pc:${d.col}"><span class="dot" style="background:${d.col}"></span><span class="nm">${hl(d.name,words)}</span><span style="flex:1"></span><span class="kind">${hl(d.kind,words)}</span>${I.star}${hov?tipHtmlB(d):''}</div>`;
 const lead=dir==='A'?`<span class="bar3" style="background:${d.col}"></span>`:glyph(d);
 return `<div class="${cls}" style="--pc:${d.col}">${lead}<span class="body"><span class="l1"><span class="nm">${hl(d.name,words)}</span>${kindTag}${I.star}</span><span class="ds">${hl(d.desc,words)}</span></span>${hov?tipHtml(d):''}</div>`;}
function tipHtmlB(d){return tipHtml(d).replace('left:40px','left:40px');}
function rowPlugin(p,s){
 const words=s.text,cls='r p'+(s.drag===p[0]?' dim':'');
 return `<div class="${cls}">${p[1]==='Instrument'?I.keys:I.knob}<span class="nm" style="flex:1">${hl(p[0],words)}</span><span class="tag">${p[2]}</span>${I.star}</div>`;}
const vh=(n,c,open=true)=>`<div class="vh">${I.arrow(open)}<span class="n">${n}</span><span class="c">${c}</span></div>`;
const dots=()=>`<span class="dots">${LUMEN.map(d=>`<i style="background:${d.col}"></i>`).join('')}</span>`;

function listHtml(s){
 const dir=s.dir,bs=builtinsFor(s),ps=pluginsFor(s);
 let h='';
 if(!bs.length&&!ps.length&&!s.safe){return `<div class="empty"><div class="t">No devices match</div><div class="h">Try other words, or clear the filters</div><span class="btn">Clear filters</span></div>`;}
 if(bs.length){
  if(dir==='B'){
   if(s.source!=='plugins'){
    GROUPS.forEach(g=>{const m=bs.filter(d=>d.group===g);if(!m.length)return;h+=`<div class="dv"><span>${g}</span></div>`+m.map(d=>rowBuiltin(dir,d,s)).join('');});
   }
  }else{
   h+=`<div class="sect">Lumen ${dots()}</div>`;
   GROUPS.forEach(g=>{const m=bs.filter(d=>d.group===g);if(!m.length)return;h+=vh(g,m.length)+m.map(d=>rowBuiltin(dir,d,s)).join('');});
  }
 }
 if(ps.length){
  const n=ps.reduce((a,v)=>a+v.items.length,0);
  h+=dir==='B'?`<div class="dv" style="margin-top:6px"><span>Plugins</span></div>`:`<div class="sect" style="margin-top:6px">Plugins <span style="letter-spacing:0;font-family:Mono;font-stretch:87.5%">${n}</span></div>`;
  ps.forEach(v=>{h+=vh(v.v,v.items.length)+v.items.map(p=>rowPlugin(p,s)).join('');});
 }
 if(s.safe){h+=`<div class="quiet"><b>Plugins are off for this run</b>Lumen's own devices are all here. Leave safe mode to list your plugins.</div>`;}
 return h;}

function chromeHtml(s){
 const dir=s.dir;
 const tabs=['rack','wave','doc','folder','disc'].map((k,i)=>`<div class="${i===0?'on':''}">${I[k]}</div>`).join('');
 const field=s.text?`<span class="tx">${s.text}</span><span class="x">✕</span>`:`<span class="tx hintx">Search devices</span>`;
 const type=['All','Instruments','Effects'].map((t,i)=>`<div class="${i===0?'on':''}">${t}</div>`).join('');
 let source='';
 if(dir==='B'){source=`<div class="inset"><div class="seg">${['All','Lumen','Plugins'].map(t=>`<div class="${(s.lumenOnly?'Lumen':'All')===t?'on':''}" ${t==='Lumen'?'':''}>${t==='Lumen'?'<span style="display:flex;gap:6px;align-items:center">Lumen</span>':t}</div>`).join('')}</div></div><div class="gap8"></div>`;}
 let chips='';
 const cats=s.safe?[]:['Dynamics','Reverb','Delay'];
 const lumenChip=dir==='B'?'':`<div class="chip ${s.lumenOnly?'on':''}">${dots()}Lumen</div>`;
 chips=`<div class="chips">${lumenChip}<div class="chip">Favorites</div><div class="chip">Recent</div>${cats.map(c=>`<div class="chip">${c}</div>`).join('')}${cats.length?'<div class="chip">More ▾</div>':''}</div>`;
 const scan=s.safe?`<div class="scan"><span class="warn">Plugins are off for this run</span><u>Leave safe mode</u></div>`:`<div class="scan"><span>${NPLUG} plugins · 3 vendors</span><u>Rescan</u></div>`;
 return `<div class="title">Browser</div>
 <div class="inset"><div class="seg">${tabs}</div></div>
 <div class="tabline"><b>Devices</b> · instruments and effects</div>
 <div class="search ${s.focus?'focus':''}">${I.search}${field}</div><div class="gap8"></div>
 <div class="inset"><div class="seg">${type}</div></div><div class="gap8"></div>
 ${source}${chips}<div class="gap4"></div>${scan}<div class="gap4"></div>`;}

function pane(s,cls=''){return `<div class="pane ${cls}" style="--h:${s.h||760}px">${chromeHtml(s)}<div class="list">${listHtml(s)}</div></div>`;}

const bodyGrav=`<svg viewBox="0 0 134 60" width="134" height="60"><path d="M4 8 C40 8 50 52 67 52 S94 8 130 8" fill="none" stroke="#B46CFF" stroke-width="2"/><circle cx="67" cy="42" r="6" fill="#E9D4FF"/></svg>`;

function frame(label,html,note=''){return `<div class="col"><div class="cap">${label}</div><div class="ui">${html}</div>${note?`<div class="note">${note}</div>`:''}</div>`;}

function render(){
 const D=OPT.dir,names={A:'Shelf',B:'Index',C:'Tiles'};
 let h=`<h1>The browser's built-ins (OR-1, option A)</h1>
 <p class="q">The owner chose A on 2026-11-14: built-ins live in the browser's Devices tab, with a one-click <b>Lumen</b> filter, listed first and grouped by kind, each row showing its personality colour and a one-line description. This page pitches <b>three ways to draw that tab</b>, then shows the states, the new menus and Flare's preset menu. Everything is a mock-up at the real pane width (260 pt, minimum 220 pt) with the real tokens and row heights. The seven plugins are anonymous labels (RP-n).</p>
 <p class="q small">What the page cannot show: the real egui text metrics (Inter is close but not identical) and the tiles' live animation (hover a row in C to see a mock of it; Motion · Reduce stops it).</p>
 <p class="q small"><b>Found while drawing it:</b> a built-in's name does not say what it is (Gravity, Horizon, Prism). So every built-in row keeps its kind visible (Compressor, Limiter, Utility), not only on hover as plugin rows do. That is also what makes a search for "comp" find Gravity.</p>

 <h2>1. Three directions</h2>
 <div class="rec"><b>Recommended: C, Tiles.</b> It is the only direction that gives each device a face to recognise before it is added, and the cards the person will meet in the chain are drawn from the same stills, so the shelf teaches what the cards look like. It keeps the owner's whole list (colour, kind, description, groups, Lumen chip). It costs seven small still painters (the faces' own pictures, reduced, static; they move on hover only, never at rest) and a row of 48 pt. Below 232 pt of pane width the tile drops to A's 3 pt colour bar, so A is its built-in fallback. B is the densest and the cheapest, but it moves the description into the tooltip, which the owner's spec asks for on the row.</div>
 <div class="row">`;
 const defs=[
  ['A','Shelf','Lumen chip; kind headers; two-line rows with a personality bar',
   ['<b>Closest to the owner\'s words:</b> chip, kind groups, colour, description on the row.','Rows are 44 pt: the seven built-ins and five headers take 440 pt of the list.','Colour is a 3 pt bar: quiet, but no picture of the device.','<b>Cheapest of the two-line options:</b> no new painting.']],
  ['B','Index','Source switch (All · Lumen · Plugins); one-line rows; hairline dividers by kind',
   ['<b>Densest:</b> built-in rows are today\'s 28 pt rows; the shelf takes 300 pt.','Source is one click, and Plugins-only comes free.','The description is not on the row: it is the tooltip and the info line (a deviation from OR-1 A).','Personality is an 8 pt dot only. Dividers are not foldable.']],
  ['C','Tiles','As A, with a 36 pt still of each device\'s face in place of the bar',
   ['<b>Personality first:</b> each device is a small picture in its own colour on its own screen.','Rows are 48 pt: the shelf takes 466 pt (kind headers fold).','Seven still painters to build, reused later by the cards\' empty states.','Hover plays a short motion (off with Reduce motion). At 220 pt it degrades to A.']]];
 defs.forEach(([k,n,sub,pros])=>{
  const s=base(k);
  h+=`<div class="col dir"><div class="dirhead"><span class="nm">${k} · ${n}</span>${k==='C'?'<span class="badge">Recommended</span>':'<span class="badge alt">Alternative</span>'}</div><div class="note" style="max-width:380px;min-height:34px">${sub}</div><div class="ui">${pane(s)}</div><ul>${pros.map(p=>`<li>${p}</li>`).join('')}</ul></div>`;});
 h+=`</div>

 <h2>2. States, direction ${D} · ${names[D]}${D==='C'?' (recommended)':''}</h2>
 <p class="q small">Switch direction in the bar. Each pane is the Devices tab at the default 260 pt width with a 760 pt body (a 1080p window); the minimum window is below.</p>
 <div class="row">`;
 const hovered=LUMEN[1];
 h+=frame('Default (no search)',pane(base(D)),'Built-ins first under <b>Lumen</b>, grouped by kind; the plugins follow under <b>Plugins</b>, grouped by vendor as today.');
 h+=frame('Lumen filter on',pane(base(D,{lumenOnly:true})),D==='B'?'The source switch is on <b>Lumen</b>: one click, plugins are gone.':'The <b>Lumen</b> chip is lit: one click, plugins are gone. It composes with the type switch, the category chips and the search; it is not one of the one-at-a-time chips.');
 h+=frame('Search "comp"',pane(base(D,{text:'comp',focus:true})),'Built-ins first, then plugin matches under their vendors. The words match a built-in\'s name, kind, group and description, so Gravity is found by its kind. Matches are marked.');
 h+=frame('Hover: tooltip',pane(base(D,{hover:'gravity'}))+infoline(hovered),'The tooltip gives the description and the gesture. The info line says what double-click adds to; the star and the group show on hover as plugin rows do.');
 h+=frame('Drag in progress',dragMock(base(D,{drag:'gravity',ghostY:150})),'The row dims where it was; a ghost follows the pointer (as <code>paint_drag_ghost</code> does today) and the target track lights. Empty area: a new audio track.');
 h+=frame('Empty search result',pane(base(D,{text:'fuzz',focus:true})),'The shared empty state, as today: nothing matches, one action clears.');
 h+=frame('Safe mode',pane(base(D,{safe:true})),'Built-ins are not plugins: they are all listed. The scan line says plugins are off and offers Leave safe mode; the plugin chips and the Plugins section give way to one quiet note.');
 h+=frame('Minimum window (960 × 540)',pane(base(D,{h:460}),'') ,'The list has about 250 pt at the minimum window height: in A and C the kind headers fold (state is kept) so Plugins stay reachable. Nothing overlaps; the list scrolls.');
 h+=frame('Narrowest pane (220 pt)',pane(base(D,{hover:null}),'w220'),D==='C'?'At 220 pt the tile gives way to A\'s colour bar; descriptions are cut with "…" (labels may truncate) and the tooltip carries the whole line.':'At 220 pt descriptions and names are cut with "…"; the tooltip carries the whole line.');
 h+=`</div>

 <h2>3. The menus</h2>
 <p class="q">The track menu loses six <b>Add …</b> rows and the Instrument submenu, and gains one <b>Add device…</b> row (the existing <code>Ctrl+F</code>, <i>Search devices</i>, with the clicked track made the target). The chain's right-click menu is the same single row; and because a right-click on the tail is invisible, the chain gets a visible dashed <b>Add device</b> slot after the last card.</p>
 <div class="row">`;
 h+=frame('Track menu today (a MIDI track)<span class="badge alt">Before</span>',trackMenuBefore(),'Six Add rows sit between Fold and Import, and Instrument ▸ holds Poly, Keys… as a submenu.');
 h+=frame('Track menu after OR-1<span class="badge">After</span>',trackMenuAfter(),'Instrument ▸ is gone (presets: Flare\'s Preset menu). The Add rows are one row. Unchanged rows are elided (⋮).');
 h+=frame('Chain panel: the add slot',`<div class="chainbox"><div class="hd"><b>Bass</b> · 2 devices</div><div class="strip"><span class="cchip">In</span><span class="cable"></span>${cardMini(LUMEN[3],bodyIris)}<span class="cable"></span>${cardMini(LUMEN[1],bodyGrav)}<span class="cable"></span><div class="slot hot"><b>+</b>Add device…</div><span class="cable"></span><span class="cchip">Out</span></div></div>`,'The slot is drawn dashed after the last card, lit while the pointer is over it. Click opens the browser on Devices with the search focused; a drag from the browser can also drop on it. Right-click anywhere on the tail shows the one-row menu.');
 h+=frame('Chain panel: empty',`<div class="chainbox"><div class="hd"><b>Bass</b> · no devices</div><div class="emptychain"><div class="t">No devices on Bass</div><div class="h">Double-click a device in the browser, or drag one here</div><span class="btn">Browse devices</span></div><div class="strip" style="height:44px"><span class="cchip">In</span><span class="cable" style="flex:1"></span><div class="slot" style="width:120px;height:36px;flex-direction:row;gap:8px"><b style="font-size:16px">+</b>Add device…</div><span class="cable" style="flex:1"></span><span class="cchip">Out</span></div></div>`,'The empty state keeps its words and its Browse devices button (it opens the same browser); the dashed slot sits on the cable.');
 h+=frame('Chain right-click menu',chainMenu(),'Today this menu lists six Add rows. Same row, same command.');
 h+=`</div>

 <h2>4. Flare's Preset menu</h2>
 <p class="q">Synth presets leave the track menu and live where every device's presets live. The factory ones are the five that exist today (Poly, Keys, Bass, Pluck, Pad), as values over the table, listed under <b>Factory</b> beside <b>Your presets</b>; Previous and Next preset in the card menu step through them. A project that had "Keys" keeps its sound (the values were already frozen into the project by format v36).</p>
 <div class="row">`;
 h+=frame('The card',`<div class="cardmini">${flareCard()}</div>`,'The card header is as built; its Preset field opens the menu.');
 h+=frame('Preset menu',presetPop(),'The popover is the existing preset menu (272 pt, search, headings, Save, Save as…, Show presets folder). Nothing in it is new but the factory rows. A built-in\'s "Factory" heading carries no group suffix.');
 h+=`</div>`;
 document.getElementById('root').innerHTML=h;
}
apply();render();
document.fonts.ready.then(()=>{document.body.dataset.h=document.documentElement.scrollHeight;});
</script>
