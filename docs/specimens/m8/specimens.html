<!doctype html>
<!-- M8 specimens (plan §2: DV, DE, SQ, BF). Open with ?light for the light theme.
     Drawn with the tokens of docs/DESIGN.md §3 and the app's fonts; mock-ups,
     not screenshots of built UI. -->
<html><head><meta charset="utf-8"><title>Lumen M8 specimens</title>
<style>
@font-face{font-family:Inter;src:url(../../../site/assets/fonts/Inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Unbounded;src:url(../../../site/assets/fonts/Unbounded.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(../../../site/assets/fonts/MartianMono.woff2) format("woff2");font-stretch:75% 112.5%}
body{margin:0;padding:28px 32px;font-family:Inter,sans-serif;width:1360px}
h1{font-family:Unbounded;font-weight:560;font-size:22px;margin:0 0 4px}
h2{font-family:Unbounded;font-weight:560;font-size:16px;margin:30px 0 4px}
p.q{margin:0 0 12px;font-size:13px;max-width:1100px}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.v{display:flex;flex-direction:column;gap:6px}
.lab{font-size:13px;font-weight:560}
.rec{font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;font-weight:560}
.note{font-size:11px;max-width:640px}
svg text{font-family:Inter,sans-serif}
svg .m{font-family:Mono;font-stretch:87.5%}
svg .t{font-family:Unbounded;font-weight:560}
</style></head><body><div id="root"></div>
<script>
const LIGHT = location.search.includes('light');
const D = {app:'#17191D',canvas:'#1B1D22',raised:'#23262D',overlay:'#262A31',control:'#31353E',control_hi:'#383C46',
 control_press:'#444A56',thumb_hi:'#4A5160',thumb:'#3E4551',border:'#2E323A',border_strong:'#3C414B',text:'#E6E8EC',
 text2:'#9AA0AC',hint:'#6E7480',accent:'#4FA3FF',accent_muted:'#243A55',accent_hi:'#5DAEFF',accent_lo:'#3F8FEA',
 on_accent:'#06182E',warning:'#F2B14C',grid_bar:'#343842',grid_beat:'#262930',grid_sub:'#212329',lane:'#1B1D22',
 header:'#1E2126',clip_body:'#262A31',lane_black:'#16181C',well:'#141619',ground:'#111316',record:'#E5484D',mute:'#C8CCD4'};
const L = {app:'#F1F2F4',canvas:'#FAFAFB',raised:'#E9EBEE',overlay:'#FFFFFF',control:'#E2E5E9',control_hi:'#EEF0F3',
 control_press:'#CBD0D7',thumb_hi:'#FFFFFF',thumb:'#F3F4F6',border:'#DADDE2',border_strong:'#C3C8CF',text:'#1C1F24',
 text2:'#5A6170',hint:'#878D98',accent:'#1F6FD1',accent_muted:'#D5E5FA',accent_hi:'#2A74D4',accent_lo:'#1A62BD',
 on_accent:'#FFFFFF',warning:'#A86400',grid_bar:'#D9DCE1',grid_beat:'#ECEEF1',grid_sub:'#F3F4F6',lane:'#F6F7F8',
 header:'#ECEEF1',clip_body:'#FFFFFF',lane_black:'#ECEEF1',well:'#D6DAE0',ground:'#E7E9ED',record:'#D33A40',mute:'#5A6170'};
const C = LIGHT ? L : D;
const PAL = ['#4C7A9E','#7A6A9E','#5E8C6A','#9E7A4C','#9E5A6A','#5A8E8E','#6A7EB0','#8E6A8E','#7E8E56','#A06E5A','#5686A0','#887660'];
document.body.style.background = C.ground; document.body.style.color = C.text;

// ---------- tiny SVG kit ----------
let gid = 0;
const a = o => Object.entries(o).map(([k,v]) => `${k}="${v}"`).join(' ');
const rect = (x,y,w,h,f,o={}) => `<rect ${a({x,y,width:w,height:h,fill:f,...o})}/>`;
const line = (x1,y1,x2,y2,s,w=1,o={}) => `<line ${a({x1,y1,x2,y2,stroke:s,'stroke-width':w,...o})}/>`;
const text = (x,y,s,f,size=13,o={}) => `<text ${a({x,y,fill:f,'font-size':size,...o})}>${s}</text>`;
const mono = (x,y,s,f,size=10,o={}) => text(x,y,s,f,size,{class:'m',...o});
const svg = (w,h,body) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
function grad(c1,c2){const id='g'+(gid++);return [id,`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`];}
function raised(x,y,w,h,r=6){const [id,d]=grad(C.control_hi,C.control);return d+rect(x,y,w,h,`url(#${id})`,{rx:r,stroke:C.border_strong,'stroke-width':.75});}
function filled(x,y,w,h,r=6){const [id,d]=grad(C.accent_hi,C.accent_lo);return d+rect(x,y,w,h,`url(#${id})`,{rx:r});}
function seg(x,y,items,chosen,{h=26,w=58,accent=false}={}){ // segmented control in a well
  let s=rect(x,y,items.length*w+4,h+4,C.well,{rx:7});
  items.forEach((it,i)=>{const cx=x+2+i*w;
    if(i===chosen){ s+= accent?filled(cx,y+2,w,h,6):(()=>{const [id,d]=grad(C.thumb_hi,C.thumb);return d+rect(cx,y+2,w,h,`url(#${id})`,{rx:6});})();}
    const col = i===chosen ? (accent?C.on_accent:C.text) : C.text2;
    s+=text(cx+w/2,y+2+h/2+4.5,it,col,12,{'text-anchor':'middle','font-weight':i===chosen?560:400});});
  return s;}
function hexA(hex,al){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${al})`;}
function knob(x,y,v,name,val,r=12){ // comet knob, as the send knob
  const a0=Math.PI*0.75,a1=Math.PI*2.25,av=a0+(a1-a0)*v;
  const p=(ang,rr)=>[x+Math.cos(ang)*rr,y+Math.sin(ang)*rr];
  const arc=(s,e,rr)=>{const [sx,sy]=p(s,rr),[ex,ey]=p(e,rr);return `M${sx} ${sy} A${rr} ${rr} 0 ${e-s>Math.PI?1:0} 1 ${ex} ${ey}`;};
  let s=`<path d="${arc(a0,a1,r)}" stroke="${C.control_press}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="${arc(a0,av,r)}" stroke="${C.accent}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const [hx,hy]=p(av,r); s+=`<circle cx="${hx}" cy="${hy}" r="3.2" fill="${C.accent}"/>`;
  s+=mono(x,y+3,val,C.text,7.5,{'text-anchor':'middle'});
  s+=text(x,y+r+14,name,C.text2,11,{'text-anchor':'middle'});
  return s;}
function frame(label,rec,svgStr,note=''){
  return `<div class="v"><div class="lab">${label}${rec?`<span class="rec" style="background:${C.accent_muted};color:${C.accent}">Rec</span>`:''}</div>${svgStr}${note?`<div class="note" style="color:${C.text2}">${note}</div>`:''}</div>`;}
function diamond(cx,cy,r,fill,stroke){return `<path d="M${cx} ${cy-r} L${cx+r} ${cy} L${cx} ${cy+r} L${cx-r} ${cy} Z" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;}

// ---------- shared drum content ----------
const SOUNDS=[['Kick',0],['Snare',4],['Clap',3],['Closed hat',5],['Open hat',5],['Low tom',2],['Ride',6]];
// hits: [sound index, step (16ths over 2 bars = 32), velocity 0..127]
const HITS=[];
[0,6,8,16,22,24,27].forEach(s=>HITS.push([0,s,s%8?92:118]));
[4,12,20,28].forEach(s=>HITS.push([1,s,s===28?127:104]));
[12,28].forEach(s=>HITS.push([2,s,80]));
for(let s=0;s<32;s+=2) if(s%8!==6) HITS.push([3,s,s%4?64:96]);
[6,14,22,30].forEach(s=>HITS.push([4,s,88]));
[29,30,31].forEach((s,i)=>HITS.push([5,s,70+i*14]));

function clipHeader(x,y,w,{switcher=true,which=0,title='Drums 1'}={}){
  let s=rect(x,y,w,40,C.raised);
  s+=rect(x,y,4,40,PAL[0]);
  s+=text(x+14,y+17,title,C.text,13,{'font-weight':560});
  s+=mono(x+14,y+31,'2 bars · 38 hits',C.hint,9);
  s+=line(x+128,y+8,x+128,y+32,C.border);
  let cx=x+138;
  if(switcher){ s+=seg(cx,y+5,['Lanes','Steps','Keys'],which,{w:54}); cx+=170; }
  s+=seg(cx,y+5,['Pointer','Draw'],0,{w:56}); cx+=124;
  s+=raised(cx,y+7,92,26); s+=text(cx+10,y+24,'Grid',C.text2,12); s+=mono(cx+40,y+24,'1/16',C.text,10); cx+=100;
  s+=raised(cx,y+7,76,26); s+=text(cx+38,y+24,'Quantize',C.text2,12,{'text-anchor':'middle'});
  return s;}
function lanesBody(x,y,w,h,{style='diamond',hideTail=false,nameW=150}={}){
  const rows=SOUNDS.length, rh=Math.floor(h/rows), steps=32, gx=x+nameW, gw=w-nameW, sw=gw/steps;
  let s=rect(x,y,w,h,C.canvas);
  SOUNDS.forEach(([n,c],i)=>{const ry=y+i*rh;
    s+=rect(x,ry,nameW,rh,C.header); s+=rect(x,ry,3,rh,PAL[c]);
    s+=text(x+12,ry+rh/2+4.5,n,C.text,12);
    // M S
    const bx=x+nameW-52; s+=rect(bx,ry+rh/2-9,20,18,i===4?C.mute:C.control,{rx:4}); s+=text(bx+10,ry+rh/2+4,'M',i===4?(LIGHT?'#FFFFFF':'#0B0D10'):C.text2,10,{'text-anchor':'middle','font-weight':560});
    s+=rect(bx+24,ry+rh/2-9,20,18,C.control,{rx:4}); s+=text(bx+34,ry+rh/2+4,'S',C.text2,10,{'text-anchor':'middle','font-weight':560});
    if(i%2) s+=rect(gx,ry,gw,rh,C.lane_black);
    s+=line(x,ry+rh-.5,x+w,ry+rh-.5,C.border,1);});
  for(let k=0;k<=steps;k++){const lx=gx+k*sw; s+=line(lx,y,lx,y+rows*rh,k%16===0?C.grid_bar:k%4===0?C.grid_bar:C.grid_sub,k%16===0?1.5:1,{opacity:k%4===0?1:.9});}
  HITS.forEach(([si,st,vel])=>{const ry=y+si*rh, cx=gx+st*sw, muted=si===4;
    const col=PAL[SOUNDS[si][1]]; const t=vel/127;
    if(style==='diamond'){
      const r=Math.min(rh*0.34,sw*0.62);
      s+=diamond(cx+0.5,ry+rh/2,r,muted?hexA(col,.25):hexA(col,.35+.65*t),muted?hexA(C.text2,.5):(LIGHT?'#00000040':'#FFFFFF55'));
    } else {
      const len=si===4?sw*1.8:si===0?sw*1.6:sw*0.9;
      s+=rect(cx+1,ry+5,len-2,rh-10,muted?hexA(col,.25):hexA(col,.35+.65*t),{rx:3});
      s+=rect(cx+1,ry+rh-7,(len-2)*t,2,muted?hexA(C.text2,.4):'#FFFFFFAA');
    }});
  // selection: two picked snare hits
  if(style==='diamond'){[12,20].forEach(st=>{const cx=gx+st*sw,ry=y+rh;s+=`<path d="M${cx+.5} ${ry+rh/2-rh*.34-3} L${cx+.5+rh*.34+3} ${ry+rh/2} L${cx+.5} ${ry+rh/2+rh*.34+3} L${cx+.5-rh*.34-3} ${ry+rh/2} Z" fill="none" stroke="${C.accent}" stroke-width="1.5"/>`;});}
  // playhead
  const px=gx+9.5*sw; s+=line(px,y,px,y+rows*rh,C.accent,1.5);
  return s;}
function velocityLane(x,y,w,h,nameW,sel=1){
  let s=rect(x,y,w,h,C.canvas)+rect(x,y,nameW,h,C.header);
  s+=text(x+12,y+18,'Velocity',C.text2,11); s+=text(x+12,y+34,SOUNDS[sel][0],C.hint,11);
  const gw=w-nameW,sw=gw/32;
  HITS.filter(hh=>hh[0]===sel).forEach(([si,st,v])=>{const bh=(h-12)*v/127,bx=x+nameW+st*sw;
    s+=line(bx+.5,y+h-4,bx+.5,y+h-4-bh,C.accent,2); s+=`<circle cx="${bx+.5}" cy="${y+h-4-bh}" r="3" fill="${C.accent}"/>`;});
  s+=line(x,y+.5,x+w,y+.5,C.border);
  return s;}

// ---------- DV ----------
function dvA(which=0){const w=640,h=40+7*26+52; let s=clipHeader(0,0,w,{which});
  s+=lanesBody(0,40,w,7*26); s+=velocityLane(0,40+7*26,w,52,150); return svg(w,h,s);}
function dvB(){const w=640,h=96+40+7*26; let s=rect(0,0,w,92,C.canvas);
  // arrangement row with an in-place step face on the clip
  s+=rect(0,0,150,92,C.header)+rect(0,0,3,92,PAL[0])+text(12,20,'Drums',C.text,12,{'font-weight':560})+mono(12,36,'Kit · GM',C.hint,9);
  const cx=160,cw=470; s+=rect(cx,6,cw,80,C.clip_body,{rx:5}); s+=rect(cx,6,cw,16,PAL[0],{rx:5}); s+=rect(cx,16,cw,6,PAL[0]);
  s+=text(cx+8,18,'Drums 1',LIGHT?'#FFFFFF':'#FFFFFFE6',11,{'font-weight':560});
  const sw=cw/32, rh=10; for(let r=0;r<6;r++)for(let k=0;k<32;k++){const on=HITS.find(hh=>hh[0]===r&&hh[1]===k);
    s+=rect(cx+k*sw+1,26+r*rh+1,sw-2,rh-2,on?hexA(PAL[SOUNDS[r][1]],.4+.6*on[2]/127):hexA(C.text2,.10),{rx:1.5});}
  
  s+=clipHeader(0,96,w,{switcher:false}); s+=lanesBody(0,136,w,7*26); return svg(w,h,s);}
function dvC(){const w=640,h=34+40+7*26; let s=rect(0,0,w,34,C.app);
  const tabs=['Devices','Clip','Drums','Steps','Mixer']; let x=10;
  tabs.forEach((t,i)=>{const tw=t.length*7.4+22; if(i===2){s+=rect(x,4,tw,26,C.accent_muted,{rx:6,stroke:hexA(C.accent,.38)});}
    s+=text(x+tw/2,21,t,i===2?C.accent:C.text2,12,{'text-anchor':'middle','font-weight':i===2?560:400}); x+=tw+6;});
  s+=clipHeader(0,34,w,{switcher:false}); s+=lanesBody(0,74,w,7*26); return svg(w,h,s);}

// ---------- DE ----------
function de(style){const w=640,h=7*26+52; return svg(w,h,lanesBody(0,0,w,7*26,{style})+velocityLane(0,7*26,w,52,150));}

// ---------- SQ ----------
function sq(variant){const w=640, rows=6, rh=30, nameW=150, top=34, steps=16;
  const h=top+rows*rh+(variant==='B'?64:8);
  let s=rect(0,0,w,h,C.canvas)+rect(0,0,w,top,C.raised);
  s+=text(12,21,'Steps',C.text2,12); s+=seg(60,4,['16','32'],0,{w:36}); s+=text(150,21,'per',C.hint,12);
  s+=raised(176,5,64,24); s+=mono(208,21,'1/16',C.text,10,{'text-anchor':'middle'});
  s+=text(w-170,21,'Page',C.hint,12); s+=seg(w-130,4,['1','2'],0,{w:36});
  s+=text(w-50,21,'Accent',C.text2,11);
  const gw=w-nameW-12, sw=gw/steps;
  for(let r=0;r<rows;r++){const ry=top+r*rh; s+=rect(0,ry,nameW,rh,C.header)+rect(0,ry,3,rh,PAL[SOUNDS[r][1]])+text(12,ry+rh/2+4.5,SOUNDS[r][0],C.text,12);
    for(let k=0;k<steps;k++){const x=nameW+6+k*sw, hit=HITS.find(hh=>hh[0]===r&&hh[1]===k), beat=Math.floor(k/4)%2;
      const cx=x+2,cy=ry+4,cw=sw-4,ch=rh-8; s+=rect(cx,cy,cw,ch,beat?C.well:hexA(C.well,LIGHT?.7:.75),{rx:4});
      if(hit){const col=PAL[SOUNDS[r][1]], t=hit[2]/127, acc=hit[2]>=118;
        if(variant==='A'){const fh=Math.max(5,ch*t); s+=rect(cx,cy+ch-fh,cw,fh,col,{rx:4}); s+=rect(cx,cy,cw,ch,'none',{rx:4,stroke:hexA(col,.9),'stroke-width':1});}
        else s+=rect(cx,cy,cw,ch,col,{rx:4});
        if(acc) s+=rect(cx-1.5,cy-1.5,cw+3,ch+3,'none',{rx:5,stroke:C.warning,'stroke-width':2});
      }
      if(k===9&&r===1) s+=rect(cx,cy,cw,ch,'none',{rx:4,stroke:C.accent,'stroke-width':1.5,'stroke-dasharray':'0'}); }}
  // playing step light
  s+=rect(nameW+6+9*sw+2,top+rows*rh+1,sw-4,3,C.accent,{rx:1.5});
  if(variant==='B'){const y=top+rows*rh+8; s+=rect(0,y,w,56,C.canvas)+rect(0,y,nameW,56,C.header)+text(12,y+20,'Velocity',C.text2,11)+text(12,y+36,'Kick',C.hint,11);
    for(let k=0;k<steps;k++){const hit=HITS.find(hh=>hh[0]===0&&hh[1]===k); if(!hit)continue; const bh=44*hit[2]/127,x=nameW+6+k*sw+sw/2;
      s+=rect(x-sw/2+6,y+52-bh,sw-12,bh,hexA(C.accent,.85),{rx:2});}}
  return svg(w,h,s);}

// ---------- BF: device cards ----------
function cardChrome(w,h,name,kind,body,footer){
  let s=rect(1,1,w-2,h-2,C.raised,{rx:12,stroke:C.border_strong});
  s+=`<path d="M1 13 a12 12 0 0 1 12 -12 h${w-26} a12 12 0 0 1 12 12 v34 h-${w-2} z" fill="${C.header}"/>`;
  // power
  s+=`<circle cx="20" cy="24" r="9" fill="${C.accent_muted}" stroke="${hexA(C.accent,.5)}"/><path d="M20 19 v5 M16.5 21 a5 5 0 1 0 7 0" stroke="${C.accent}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  s+=text(36,21,name,C.text,13,{'font-weight':560})+text(36,36,'Lumen',C.text2,11);
  s+=rect(w-64,14,52,20,C.control,{rx:10})+text(w-38,28,'Preset',C.text2,11,{'text-anchor':'middle'});
  s+=body;
  s+=rect(1,h-26,w-2,25,C.header,{rx:0})+line(1,h-26,w-1,h-26,C.border)+mono(12,h-9,footer,C.hint,9);
  return s;}
function strip(y,ks,w=232){let s='';const cols=4,dx=(w-16)/cols;ks.forEach((k,i)=>{s+=knob(8+dx/2+(i%cols)*dx,y+20+Math.floor(i/cols)*58,k[2],k[0],k[1]);});return s;}
function allBtn(y,w,n){return raised(12,y,w-24,20,5)+text(w/2,y+14,`All ${n} parameters`,C.text2,11,{'text-anchor':'middle'});}
function cardKnobs(name,ks,n,footer='audio → audio · 0 ms'){const w=232,h=232;
  const body=strip(54,ks)+allBtn(178,w,n); return svg(w,h,cardChrome(w,h,name,'fx',body,footer));}
function eqCurve(x,y,w,h){let s=rect(x,y,w,h,C.well,{rx:6});
  [100,1000,10000].forEach(f=>{const lx=x+w*Math.log10(f/20)/Math.log10(1000);s+=line(lx,y,lx,y+h,C.grid_bar);s+=mono(lx+3,y+h-4,f>=1000?f/1000+'k':f,C.hint,8);});
  s+=line(x,y+h/2,x+w,y+h/2,C.grid_bar);
  // analyzer
  let pa=`M${x} ${y+h}`; for(let i=0;i<=w;i+=3){const t=i/w, v=0.55+0.25*Math.sin(t*9)+0.12*Math.sin(t*31)-t*0.45; pa+=` L${x+i} ${y+h-h*Math.max(.05,v)*0.75}`;} pa+=` L${x+w} ${y+h} Z`;
  s+=`<path d="${pa}" fill="${hexA(C.text2,.16)}"/>`;
  // curve: low cut, bell +4 at 200, dip -3 at 2.5k, high shelf +2
  const g=t=>{const f=20*Math.pow(1000,t);let db=0;db-=12*Math.max(0,Math.log2(40/f));db+=4*Math.exp(-Math.pow(Math.log2(f/200)/0.8,2));db-=3*Math.exp(-Math.pow(Math.log2(f/2500)/0.6,2));db+=2/(1+Math.pow(8000/f,2));return db;};
  let pc='';for(let i=0;i<=w;i+=2){const yy=y+h/2-g(i/w)*h/30;pc+=(i?' L':'M')+(x+i)+' '+yy;}
  s+=`<path d="${pc} L${x+w} ${y+h/2} L${x} ${y+h/2} Z" fill="${hexA(C.accent,.10)}"/><path d="${pc}" stroke="${C.accent}" stroke-width="2" fill="none"/>`;
  [[40,0,1],[200,4,2],[2500,-3,3],[8000,2,4]].forEach(([f,db,n],i)=>{const px=x+w*Math.log10(f/20)/3,py=y+h/2-db*h/30;
    s+=`<circle cx="${px}" cy="${py}" r="${i===1?11:0}" fill="${hexA(C.accent,.2)}"/><circle cx="${px}" cy="${py}" r="7" fill="${i===1?C.accent:C.control_press}" stroke="${C.accent}" stroke-width="1.2"/>`;
    s+=text(px,py+3.5,n,i===1?C.on_accent:C.text,9,{'text-anchor':'middle','font-weight':560});});
  s+=rect(x+w*Math.log10(200/20)/3-38,y+6,76,18,C.overlay,{rx:4,stroke:C.border_strong})+mono(x+w*Math.log10(200/20)/3,y+18,'200 Hz +4.0',C.text,8.5,{'text-anchor':'middle'});
  return s;}
function cardEQ(){const w=360,h=262; let b=eqCurve(12,54,w-24,150);
  b+=mono(12,222,'Band 2 · Bell',C.text2,9)+mono(w/2,222,'Q 0.9',C.text,9,{'text-anchor':'middle'})+raised(w-104,210,92,20,5)+text(w-58,224,'All 41 parameters',C.text2,10,{'text-anchor':'middle'});
  return svg(w,h,cardChrome(w,h,'EQ','fx',b,'audio → audio · 0 ms · analyzer post'));}
function cardComp(){const w=360,h=262; let b=''; const x=12,y=52,s=148;
  b+=rect(x,y,s,s,C.well,{rx:6}); for(let i=1;i<4;i++){b+=line(x+i*s/4,y,x+i*s/4,y+s,C.grid_bar);b+=line(x,y+i*s/4,x+s,y+i*s/4,C.grid_bar);}
  b+=line(x,y+s,x+s,y,hexA(C.text2,.35),1,{'stroke-dasharray':'3 3'});
  const th=0.6; let p=`M${x} ${y+s}`; for(let i=0;i<=s;i+=2){const t=i/s;const o=t<th?t:th+(t-th)/4; p+=` L${x+i} ${y+s-o*s}`;} b+=`<path d="${p}" stroke="${C.accent}" stroke-width="2" fill="none"/>`;
  b+=`<circle cx="${x+th*s}" cy="${y+s-th*s}" r="5" fill="${C.accent}"/>`; b+=`<circle cx="${x+0.78*s}" cy="${y+s-(th+(0.78-th)/4)*s}" r="3.5" fill="${C.text}"/>`;
  // GR meter
  const mx=x+s+12; b+=rect(mx,y,14,s,C.well,{rx:4})+rect(mx+2,y+2,10,38,C.warning,{rx:2})+mono(mx+7,y+s+12,'GR',C.hint,8,{'text-anchor':'middle'})+mono(mx+7,y+52,'-4.1',C.text,8,{'text-anchor':'middle'});
  b+=knob(x+s+70,y+22,.6,'Threshold','-18')+knob(x+s+134,y+22,.45,'Ratio','4:1')+knob(x+s+70,y+82,.2,'Attack','5ms')+knob(x+s+134,y+82,.5,'Release','120')+knob(x+s+70,y+134,.7,'Makeup','auto')+knob(x+s+134,y+134,1,'Mix','100%');
  b+=rect(12,212,150,20,C.control,{rx:5})+text(20,226,'Sidechain: Kick · post fx',C.text2,10)+raised(170,212,52,20,5)+text(196,226,'Listen',C.text2,10,{'text-anchor':'middle'});
  return svg(w,h,cardChrome(w,h,'Compressor','fx',b,'audio → audio · 0 ms · keyed'));}
function cardLimiter(){const w=232,h=262; let b=''; const x=12,y=54,ww=208,hh=110;
  b+=rect(x,y,ww,hh,C.well,{rx:6}); let p='';for(let i=0;i<=ww;i+=2){const v=.5+.35*Math.sin(i/7)*Math.sin(i/41)+.1*Math.sin(i/2.3);p+=(i?' L':'M')+(x+i)+' '+(y+hh-Math.min(v,.78)*hh);}
  b+=`<path d="${p}" stroke="${hexA(C.text2,.7)}" stroke-width="1" fill="none"/>`+line(x,y+hh*.22,x+ww,y+hh*.22,C.warning,1.5,{'stroke-dasharray':'4 3'})+mono(x+ww-4,y+hh*.22-4,'-0.3 dB',C.warning,8,{'text-anchor':'end'});
  b+=knob(50,y+hh+30,.85,'Ceiling','-0.3')+knob(116,y+hh+30,.3,'Release','60')+knob(182,y+hh+30,.4,'Lookahead','1.5');
  return svg(w,h,cardChrome(w,h,'Limiter','fx',b,'audio → audio · 1.5 ms · true peak'));}
function cardPads(){const w=360,h=262; let b=''; const cols=4,pw=78,ph=34,x0=12,y0=54;
  const pads=['Kick','Snare','Clap','Closed hat','Open hat','Low tom','Ride','Crash','—','—','—','—'];
  pads.forEach((n,i)=>{const x=x0+(i%cols)*(pw+6),y=y0+Math.floor(i/cols)*(ph+6),empty=n==='—',col=PAL[(SOUNDS[i]||['',i])[1]];
    if(empty){b+=rect(x,y,pw,ph,'none',{rx:6,stroke:C.border_strong,'stroke-dasharray':'4 3'})+text(x+pw/2,y+21,'Drop a file',C.hint,10,{'text-anchor':'middle'});return;}
    b+=rect(x,y,pw,ph,i===1?C.accent_muted:C.control,{rx:6,stroke:i===1?C.accent:C.border_strong,'stroke-width':i===1?1.5:.75})+rect(x,y,4,ph,col,{rx:2});
    let wp='';for(let k=0;k<40;k++){const a=Math.exp(-k/(i<2?8:4))*(k%2?1:-1)*9;wp+=(k?' L':'M')+(x+12+k*1.5)+' '+(y+ph/2+a*.9);} b+=`<path d="${wp}" stroke="${hexA(col,.9)}" fill="none"/>`;
    b+=text(x+pw-6,y+13,n,C.text,9.5,{'text-anchor':'end'}); if(i===3||i===4) b+=mono(x+pw-6,y+ph-6,'choke 1',C.hint,8,{'text-anchor':'end'}); if(i===0) b+=mono(x+pw-6,y+ph-6,'out 3-4',C.hint,8,{'text-anchor':'end'});});
  b+=seg(12,182,['One shot','Zones','Pads'],2,{w:62,h:20})+mono(w-12,198,'map: 808-style',C.hint,9,{'text-anchor':'end'});
  b+=raised(12,210,160,20,5)+text(92,224,'Snare: level, tune, pan…',C.text2,10,{'text-anchor':'middle'});
  return svg(w,h,cardChrome(w,h,'Sampler','inst',b,'MIDI → audio · 8 pads · 14.2 MB'));}
function cardDelayDrawn(){const w=232,h=262; let b=''; const x=12,y=54,ww=208,hh=100; b+=rect(x,y,ww,hh,C.well,{rx:6});
  for(let i=0;i<8;i++){const xx=x+14+i*24,a=Math.pow(.72,i),side=i%2?-1:1; b+=line(xx,y+hh/2,xx,y+hh/2-side*a*40,i?C.accent:C.text,3,{'stroke-linecap':'round'});}
  b+=mono(x+6,y+12,'L',C.hint,8)+mono(x+6,y+hh-4,'R',C.hint,8);
  b+=knob(50,y+hh+34,.5,'Time','1/8.')+knob(116,y+hh+34,.55,'Feedback','45%')+knob(182,y+hh+34,.3,'Mix','25%');
  return svg(w,h,cardChrome(w,h,'Delay','fx',b,'audio → audio · tail 3.2 s'));}
function cardReverbDrawn(){const w=232,h=262; let b=''; const x=12,y=54,ww=208,hh=100; b+=rect(x,y,ww,hh,C.well,{rx:6});
  let p=`M${x+20} ${y+hh}`; p+=` L${x+20} ${y+12}`; for(let i=0;i<=170;i+=3){p+=` L${x+26+i} ${y+12+(hh-12)*(1-Math.exp(-i/45))}`;} p+=` L${x+196} ${y+hh} Z`;
  b+=`<path d="${p}" fill="${hexA(C.accent,.18)}" stroke="${C.accent}" stroke-width="1.5"/>`+line(x+20,y+6,x+20,y+hh,C.text,1.5)+mono(x+26,y+20,'2.4 s',C.text,9);
  b+=knob(50,y+hh+34,.5,'Size','62%')+knob(116,y+hh+34,.45,'Decay','2.4s')+knob(182,y+hh+34,.3,'Mix','20%');
  return svg(w,h,cardChrome(w,h,'Reverb','fx',b,'audio → audio · tail 4.8 s'));}

// ---------- page ----------
const pill = s=>`<span style="font-family:Mono;font-size:12px;color:${C.text2}">${s}</span>`;
let H=`<h1>M8 specimens ${pill(LIGHT?'light':'dark')}</h1><p class="q" style="color:${C.text2}">Plan §2 choices DV, DE, SQ and BF, drawn with Lumen's tokens and faces at 100%. Mock-ups, not built UI. Same clip throughout: 2 bars, 7 sounds; Open hat is muted, two snare hits are picked, the playhead is in bar 1.</p>`;
H+=`<h2>DV · the drum editor and the step sequencer</h2><p class="q" style="color:${C.text2}">Where Lanes (drum editor) and Steps (step sequencer) live.</p><div class="row">`;
H+=frame('A · one clip editor with Lanes / Steps / Keys in the shared header',true,dvA(0),'All three views of the same clip are one click apart; a clip on a track with a map opens in Lanes.');
H+=frame('B · Lanes in the Clip tab; steps edited on the arrangement clip',false,dvB(),'The clip face becomes a tiny step grid you click in place. Click a cell to toggle. Quick, but cells are about 14 × 8 pt.');
H+=frame('C · separate Drums and Steps tabs in the detail panel',false,dvC(),'Two more tabs in the tab row; the clip header has no switch.');
H+=`</div><h2>DE · what a drum hit looks like in the lanes</h2><div class="row">`;
H+=frame('A · diamond at the start, fill brightness is velocity',true,de('diamond'),'Lengths are hidden (drums are mostly one-shots); picked hits get the accent outline.');
H+=frame('B · short bar with its length, velocity bar along its foot',false,de('bar'),'As the piano roll draws notes. Shows length overrides, busier at small zoom.');
H+=`</div><h2>SQ · the step sequencer grid</h2><div class="row">`;
H+=frame('A · velocity is the fill height, accent is an amber rim',true,sq('A'),'Click toggles, drag up or down sets velocity, Shift+click toggles accent; step 10 has keyboard focus.');
H+=frame('B · cells are on or off, velocity in a lane under the grid',false,sq('B'),'Cleaner grid, but velocity is edited for one row at a time.');
H+=`</div><h2>BF · faces of the built-in devices</h2><p class="q" style="color:${C.text2}">Cards keep the chain's chrome (power, name, preset, footer). Every parameter stays reachable in All parameters.</p>`;
H+=`<div class="lab" style="margin:8px 0">A · the eight-knob strip for every built-in</div><div class="row">`;
H+=cardKnobs('EQ',[['1 Freq','40',.15],['1 Slope','24',.4],['2 Freq','200',.35],['2 Gain','+4.0',.65],['2 Q','0.9',.4],['3 Freq','2.5k',.65],['3 Gain','-3.0',.4],['Output','0.0',.5]],41);
H+=cardKnobs('Compressor',[['Threshold','-18',.6],['Ratio','4:1',.45],['Attack','5ms',.2],['Release','120',.5],['Knee','6',.3],['Makeup','auto',.7],['Mix','100%',1],['SC HPF','80',.25]],12,'audio → audio · 0 ms · keyed');
H+=cardKnobs('Sampler',[['Level','0.0',.7],['Tune','0',.5],['Attack','0',.05],['Decay','300',.4],['Sustain','100%',1],['Release','80',.2],['Cutoff','18k',.95],['Reso','0%',0]],64,'MIDI → audio · 8 pads');
H+=`</div><div class="lab" style="margin:18px 0 8px">C · drawn face where a picture is the control, strip for the rest <span class="rec" style="background:${C.accent_muted};color:${C.accent}">Rec</span></div><div class="row">`;
H+=cardEQ()+cardComp()+cardLimiter()+cardPads();
H+=cardKnobs('Utility',[['Gain','0.0',.5],['Pan','C',.5],['Width','100%',.5],['Bass mono','120',.3],['Mono','off',0],['Flip L','off',0],['Flip R','off',0],['Swap','off',0]],9);
H+=cardKnobs('Reverb',[['Pre-delay','12',.2],['Size','62%',.62],['Decay','2.4s',.45],['Damping','5k',.55],['Width','100%',1],['Early','30%',.3],['Late','70%',.7],['Mix','20%',.2]],11,'audio → audio · tail 4.8 s');
H+=`</div><div class="lab" style="margin:18px 0 8px">B · C, plus drawn faces for delay, reverb and the rest</div><div class="row">`;
H+=cardDelayDrawn()+cardReverbDrawn()+`<div class="note" style="color:${C.text2};max-width:420px;align-self:center">B draws every built-in, utility and synth included. More to build and keep consistent, and a drawn delay or reverb mostly restates three knobs.</div></div>`;
document.getElementById('root').innerHTML=H;
</script></body></html>
